<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f7fd"><title>Prepara tu PAES · Aprende a tu ritmo</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#23213c;background:#f9f7fd}*{box-sizing:border-box}body{margin:0}main{max-width:750px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}header strong{font-size:21px;letter-spacing:-.8px}.logo{color:#7357d8}.pill{font-size:12px;border-radius:30px;background:#eee9fc;padding:8px 12px;color:#563bb9}.eyebrow{color:#7357d8;font-weight:800;font-size:12px;letter-spacing:1.7px}h1{font-size:clamp(32px,7vw,50px);line-height:1.1;letter-spacing:-2px;margin:12px 0}h2{font-size:25px;letter-spacing:-.7px;margin:0 0 10px}p{line-height:1.6;color:#5b5971}.card{background:white;border:1px solid #e9e6f3;border-radius:23px;padding:25px;margin:20px 0;box-shadow:0 10px 30px #27204709}.btn{border:0;padding:16px 22px;cursor:pointer;border-radius:14px;font:700 16px system-ui;background:#7357d8;color:#fff}.btn.secondary{background:#eee9fc;color:#4934a9}.btn:disabled{opacity:.45;cursor:not-allowed}.stack{display:grid;gap:10px}.option{width:100%;background:#fff;border:2px solid #e8e5f2;color:#2e2940;border-radius:14px;padding:16px;text-align:left;font:500 16px system-ui;cursor:pointer}.option.selected{border-color:#7357d8;background:#f1edff}.option.correct{border-color:#249c74}.option.wrong{border-color:#d9676c}.bar{height:9px;border-radius:20px;background:#edeaf6;overflow:hidden}.bar>div{height:100%;background:#7357d8}.small{font-size:13px}.muted{color:#75738a}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.result{background:#f2f9f4;border-radius:14px;padding:16px;margin:16px 0}.result.error{background:#fff3f0}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tabs button{border:1px solid #e7e2f4;background:white;color:#51438b;padding:10px 13px;border-radius:11px;cursor:pointer}.tabs button.active{background:#7357d8;color:white}footer{margin-top:45px;font-size:12px;color:#777}
</style></head><body><main id="app"></main><script>
const questions=[
{id:1,skill:"Porcentajes",q:"Una chaqueta cuesta $40.000 y tiene un 25% de descuento. ¿Cuál es el precio final?",options:["$10.000","$25.000","$30.000","$35.000"],answer:2,explanations:["Calculaste cuánto se descuenta, no el precio final.","El 25% de $40.000 equivale a $10.000, no a $15.000.","¡Bien! El descuento es de $10.000.","Revisa cuánto vale un cuarto del precio original."],steps:["Calcula el 25% de $40.000: 40.000 × 0,25 = 10.000.","Resta el descuento: 40.000 − 10.000 = 30.000.","Verifica: el resultado debe ser menor que el precio original."],easy:"25% es la cuarta parte. Si divides $40.000 en cuatro partes, cada una vale $10.000. Restas esa parte y quedan $30.000.",example:"Una polera de $20.000 con 25% de descuento queda en $15.000."},
{id:2,skill:"Ecuaciones",q:"Si 3x + 5 = 20, ¿cuánto vale x?",options:["3","5","7","15"],answer:1,explanations:["Al restar 5 obtienes 15, pero todavía debes dividir por 3.","¡Correcto! Primero restas 5 y después divides por 3.","No debes sumar el 5 cuando despejas.","15 corresponde a 3x, no a x."],steps:["Resta 5 a ambos lados: 3x = 15.","Divide ambos lados por 3: x = 5.","Comprueba: 3 × 5 + 5 = 20."],easy:"Busca el número que multiplicado por 3 y luego sumado con 5 te da 20.",example:"Tres entradas iguales y un recargo de $5 suman $20: cada entrada vale $5."},
{id:3,skill:"Proporcionalidad",q:"Si 4 cuadernos cuestan $6.000, ¿cuánto cuestan 6 cuadernos al mismo precio unitario?",options:["$8.000","$9.000","$10.000","$12.000"],answer:1,explanations:["Calcula primero el valor de un cuaderno.","¡Correcto! Cada cuaderno vale $1.500.","Revisa la multiplicación del valor unitario.","Ese valor correspondería a 8 cuadernos."],steps:["Un cuaderno vale $6.000 ÷ 4 = $1.500.","Seis cuadernos cuestan 6 × $1.500 = $9.000."],easy:"Primero averigua cuánto vale uno y luego calcula cuánto valen seis.",example:"Si dos pasajes cuestan $2.000, tres costarán $3.000 al mismo precio."},
{id:4,skill:"Potencias",q:"¿Cuál es el valor de 2³ + 3²?",options:["12","13","17","25"],answer:2,explanations:["Las potencias no se obtienen multiplicando base y exponente.","Calcula cada potencia por separado antes de sumar.","¡Eso! 8 + 9 = 17.","No sumes bases ni exponentes antes de calcular."],steps:["2³ = 2 × 2 × 2 = 8.","3² = 3 × 3 = 9.","8 + 9 = 17."],easy:"El exponente indica cuántas veces multiplicas la base por sí misma.",example:"Dos grupos de 2×2×2 cajas son 16 cajas en total."},
{id:5,skill:"Probabilidad",q:"Una bolsa tiene 3 bolitas rojas y 2 azules. ¿Cuál es la probabilidad de sacar una azul?",options:["2/3","2/5","3/5","1/2"],answer:1,explanations:["El total de bolitas es 5, no 3.","¡Correcto! Hay 2 azules de 5 bolitas en total.","Esa es la probabilidad de sacar una roja.","Las posibilidades no son iguales: hay 3 rojas y 2 azules."],steps:["Cuenta los casos favorables: 2 bolitas azules.","Cuenta todos los resultados: 3 + 2 = 5.","Probabilidad = 2/5."],easy:"Piensa en cuántas opciones te sirven de todas las que existen.",example:"Con 1 premio en 10 sobres, tu probabilidad es 1/10."}
];
const store='prepara-paes-demo-v1';let history=[];try{history=JSON.parse(localStorage.getItem(store)||'[]')}catch{}let page='home',queue=[],i=0,choice=null,confidence='duda',checked=false,mode='steps';const app=document.getElementById('app');function save(){localStorage.setItem(store,JSON.stringify(history))}function head(){return '<header><strong><span class="logo">✳</span> Prepara tu PAES</strong><span class="pill">Demo M1 · Chile</span></header>'}function start(type){const ranked=[...questions].sort((a,b)=>{const score=q=>history.filter(h=>h.id===q.id).reduce((v,h)=>v+(h.correct?1:-2),0);return score(a)-score(b)});queue=type==='repaso'?ranked.slice(0,3):type==='rapida'?questions.slice(0,3):questions.slice();i=0;choice=null;checked=false;page='quiz';draw()}function home(){return '<span class="eyebrow">TU PREPARACIÓN PARTE ACÁ</span><h1>Estudiar para la PAES puede sentirse distinto.</h1><p>Practica a tu ritmo, entiende tus errores y demuestra que aprendiste. Sin discursos lateros ni presión innecesaria.</p><div class="card"><h2>¿Vamos con Matemática M1?</h2><p>Partimos con preguntas originales de demostración. No son ensayos oficiales.</p><div class="stack"><button class="btn" onclick="start(\'diagnostico\')">Hacer diagnóstico · 5 preguntas</button><button class="btn secondary" onclick="start(\'rapida\')">Práctica rápida · 3 preguntas</button><button class="btn secondary" onclick="start(\'repaso\')">Repasar mis puntos débiles</button><button class="btn secondary" onclick="page=\'progress\';draw()">Ver mi progreso</button></div></div>'}function quiz(){const q=queue[i];let options=q.options.map((o,j)=>'<button '+(checked?'disabled':'')+' class="option '+(choice===j?'selected ':'')+(checked&&j===q.answer?'correct':checked&&j===choice?'wrong':'')+'" onclick="choice='+j+';draw()">'+String.fromCharCode(65+j)+') '+o+'</button>').join('');let review='';if(checked){const correct=choice===q.answer;review='<div class="result '+(correct?'':'error')+'"><b>'+(correct?'¡Bien ahí!':'No era esa, pero vamos a entenderla.')+'</b><p>'+q.explanations[choice]+'</p><p><b>Respuesta correcta: '+String.fromCharCode(65+q.answer)+') '+q.options[q.answer]+'</b></p></div><h3>Explícamelo de otra forma</h3><div class="tabs">'+[['steps','Paso a paso'],['easy','Más fácil'],['example','Con un ejemplo']].map(([key,label])=>'<button class="'+(mode===key?'active':'')+'" onclick="mode=\''+key+'\';draw()">'+label+'</button>').join('')+'</div><div class="card">'+(mode==='steps'?'<ol>'+q.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>':'<p>'+q[mode]+'</p>')+'</div><button class="btn" onclick="next()">'+(i===queue.length-1?'Ver mi resultado':'Siguiente pregunta →')+'</button>'}return '<div class="row"><button class="btn secondary" onclick="page=\'home\';draw()">← Inicio</button><b>'+(i+1)+' / '+queue.length+'</b></div><div class="bar"><div style="width:'+((i+1)/queue.length*100)+'%"></div></div><div class="card"><span class="eyebrow">MATEMÁTICA M1 · '+q.skill+'</span><h2 style="margin-top:16px">'+q.q+'</h2><div class="stack">'+options+'</div>'+(!checked?'<p class="small">¿Qué tan seguro estás?</p><div class="tabs">'+[['seguro','Lo tengo claro'],['duda','Tengo dudas'],['azar','Fue al azar']].map(([v,t])=>'<button class="'+(confidence===v?'active':'')+'" onclick="confidence=\''+v+'\';draw()">'+t+'</button>').join('')+'</div><p><button class="btn" '+(choice===null?'disabled':'')+' onclick="check()">Comprobar respuesta</button></p>':review)+'</div>'}function check(){if(choice===null||checked)return;const q=queue[i];history.push({id:q.id,skill:q.skill,correct:choice===q.answer,confidence,date:new Date().toISOString()});save();checked=true;draw()}function next(){if(i+1===queue.length){page='result'}else{i++;choice=null;checked=false;confidence='duda';mode='steps'}draw()}function result(){let ids=new Set(queue.map(x=>x.id));let rec=history.slice(-queue.length);let wins=rec.filter(h=>h.correct).length;return '<span class="eyebrow">RONDA TERMINADA</span><h1>¡Bien por darte el tiempo!</h1><div class="card"><h2>'+wins+' de '+queue.length+' correctas</h2><p>No importa solo cuántas acertaste: importa que hayas entendido el camino.</p><button class="btn" onclick="start(\'repaso\')">Practicar lo que cuesta</button> <button class="btn secondary" onclick="page=\'progress\';draw()">Ver progreso</button></div>'}function progress(){let unique=[...new Set(history.map(h=>h.skill))];return '<span class="eyebrow">TU PROGRESO</span><h1>Cada intento cuenta.</h1><div class="card"><h2>'+history.length+' respuestas registradas</h2><p>Guardamos el avance únicamente en este dispositivo.</p>'+(unique.length?unique.map(skill=>{let h=history.filter(x=>x.skill===skill),n=h.filter(x=>x.correct).length;return '<p><b>'+skill+'</b> · '+n+'/'+h.length+' aciertos</p><div class="bar"><div style="width:'+(100*n/h.length)+'%"></div></div>'}).join(''):'<p>Aún no hay resultados. Parte con una práctica.</p>')+'</div><button class="btn" onclick="start(\'repaso\')">Repasar</button> <button class="btn secondary" onclick="page=\'home\';draw()">Volver</button>'}function draw(){app.innerHTML=head()+({home,quiz,result,progress}[page]||home)()+'<footer>Prototipo educativo · Preguntas de demostración, no material DEMRE · Sin cuentas ni predicción de puntaje.</footer>'}draw();
</script></body></html>
