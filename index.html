<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f7fd"><meta name="description" content="Cachaste: aprende Matemática M1 para la PAES a tu ritmo, con explicaciones cercanas y progreso en tu dispositivo."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237357d8%27/%3E%3Ctext x=%2716%27 y=%2724%27 text-anchor=%27middle%27 font-size=%2726%27 fill=%27white%27%3E✳%3C/text%3E%3C/svg%3E"><title>Cachaste · Aprende a tu ritmo</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#23213c;background:#f9f7fd}*{box-sizing:border-box}body{margin:0}main{max-width:750px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}header strong{font-size:21px;letter-spacing:-.8px}.logo{color:#7357d8}.pill{font-size:12px;border-radius:30px;background:#eee9fc;padding:8px 12px;color:#563bb9}.eyebrow{color:#7357d8;font-weight:800;font-size:12px;letter-spacing:1.7px}h1{font-size:clamp(32px,7vw,50px);line-height:1.1;letter-spacing:-2px;margin:12px 0}h2{font-size:25px;letter-spacing:-.7px;margin:0 0 10px}p{line-height:1.6;color:#5b5971}.card{background:white;border:1px solid #e9e6f3;border-radius:23px;padding:25px;margin:20px 0;box-shadow:0 10px 30px #27204709}.btn{border:0;padding:16px 22px;cursor:pointer;border-radius:14px;font:700 16px system-ui;background:#7357d8;color:#fff}.btn.secondary{background:#eee9fc;color:#4934a9}.btn:disabled{opacity:.45;cursor:not-allowed}.stack{display:grid;gap:10px}.option{width:100%;background:#fff;border:2px solid #e8e5f2;color:#2e2940;border-radius:14px;padding:16px;text-align:left;font:500 16px system-ui;cursor:pointer}.option.selected{border-color:#7357d8;background:#f1edff}.option.correct{border-color:#249c74}.option.wrong{border-color:#d9676c}.bar{height:9px;border-radius:20px;background:#edeaf6;overflow:hidden}.bar>div{height:100%;background:#7357d8}.small{font-size:13px}.muted{color:#75738a}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.result{background:#f2f9f4;border-radius:14px;padding:16px;margin:16px 0}.result.error{background:#fff3f0}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tabs button{border:1px solid #e7e2f4;background:white;color:#51438b;padding:10px 13px;border-radius:11px;cursor:pointer}.tabs button.active{background:#7357d8;color:white}footer{margin-top:45px;font-size:12px;color:#777}

:root{color-scheme:light}body{background:radial-gradient(ellipse at 12% 0%,#f1edff 0%,transparent 48%),radial-gradient(ellipse at 95% 28%,#fff2e6 0%,transparent 40%),#faf9ff;min-height:100vh}.card{box-shadow:0 15px 38px #30205a0a;transition:box-shadow .18s ease}.btn,.option,.tabs button{transition:background-color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.btn:active,.option:active,.tabs button:active{transform:scale(.985)}.btn:hover:not(:disabled){box-shadow:0 6px 18px #7357d82b}.option:hover:not(:disabled){border-color:#a591ed;background:#fbfaff}.option.selected{box-shadow:0 0 0 2px #7357d81a}.result{border:1px solid #d5eedd}.result.error{border-color:#f2dcd3}.feedback-icon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#dbf5e6;color:#176b4b;margin-right:8px;font-weight:800}.feedback-icon.retry{background:#ffe9dd;color:#9b4c32}.celebrate{animation:pop-in .35s cubic-bezier(.2,1.35,.4,1)}.encouragement{font-size:14px;color:#5a5772;margin-top:10px}.bar>div{transition:width .24s ease}.card{animation:appear .25s ease-out}@keyframes pop-in{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(hover:none){.btn:hover:not(:disabled){box-shadow:none}.option:hover:not(:disabled){background:#fff;border-color:#e8e5f2}.option.selected:hover{background:#f1edff;border-color:#7357d8}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:380px){header strong{font-size:18px}.eyebrow{letter-spacing:1px}}

</style></head><body><main id="app"></main><script>
const questions=[
{id:1,skill:"Porcentajes",q:"Una chaqueta cuesta $40.000 y tiene un 25% de descuento. ¿Cuál es el precio final?",options:["$10.000","$25.000","$30.000","$35.000"],answer:2,explanations:["Calculaste cuánto se descuenta, no el precio final.","El 25% de $40.000 equivale a $10.000, no a $15.000.","¡Bien! El descuento es de $10.000.","Revisa cuánto vale un cuarto del precio original."],steps:["Calcula el 25% de $40.000: 40.000 × 0,25 = 10.000.","Resta el descuento: 40.000 − 10.000 = 30.000.","Verifica: el resultado debe ser menor que el precio original."],easy:"25% es la cuarta parte. Si divides $40.000 en cuatro partes, cada una vale $10.000. Restas esa parte y quedan $30.000.",example:"Una polera de $20.000 con 25% de descuento queda en $15.000."},
{id:2,skill:"Ecuaciones",q:"Si 3x + 5 = 20, ¿cuánto vale x?",options:["3","5","7","15"],answer:1,explanations:["Al restar 5 obtienes 15, pero todavía debes dividir por 3.","¡Correcto! Primero restas 5 y después divides por 3.","No debes sumar el 5 cuando despejas.","15 corresponde a 3x, no a x."],steps:["Resta 5 a ambos lados: 3x = 15.","Divide ambos lados por 3: x = 5.","Comprueba: 3 × 5 + 5 = 20."],easy:"Busca el número que multiplicado por 3 y luego sumado con 5 te da 20.",example:"Tres entradas iguales y un recargo de $5 suman $20: cada entrada vale $5."},
{id:3,skill:"Proporcionalidad",q:"Si 4 cuadernos cuestan $6.000, ¿cuánto cuestan 6 cuadernos al mismo precio unitario?",options:["$8.000","$9.000","$10.000","$12.000"],answer:1,explanations:["Calcula primero el valor de un cuaderno.","¡Correcto! Cada cuaderno vale $1.500.","Revisa la multiplicación del valor unitario.","Ese valor correspondería a 8 cuadernos."],steps:["Un cuaderno vale $6.000 ÷ 4 = $1.500.","Seis cuadernos cuestan 6 × $1.500 = $9.000."],easy:"Primero averigua cuánto vale uno y luego calcula cuánto valen seis.",example:"Si dos pasajes cuestan $2.000, tres costarán $3.000 al mismo precio."},
{id:4,skill:"Potencias",q:"¿Cuál es el valor de 2³ + 3²?",options:["12","13","17","25"],answer:2,explanations:["Las potencias no se obtienen multiplicando base y exponente.","Calcula cada potencia por separado antes de sumar.","¡Eso! 8 + 9 = 17.","No sumes bases ni exponentes antes de calcular."],steps:["2³ = 2 × 2 × 2 = 8.","3² = 3 × 3 = 9.","8 + 9 = 17."],easy:"El exponente indica cuántas veces multiplicas la base por sí misma.",example:"Dos grupos de 2×2×2 cajas son 16 cajas en total."},
{id:5,skill:"Probabilidad",q:"Una bolsa tiene 3 bolitas rojas y 2 azules. ¿Cuál es la probabilidad de sacar una azul?",options:["2/3","2/5","3/5","1/2"],answer:1,explanations:["El total de bolitas es 5, no 3.","¡Correcto! Hay 2 azules de 5 bolitas en total.","Esa es la probabilidad de sacar una roja.","Las posibilidades no son iguales: hay 3 rojas y 2 azules."],steps:["Cuenta los casos favorables: 2 bolitas azules.","Cuenta todos los resultados: 3 + 2 = 5.","Probabilidad = 2/5."],easy:"Piensa en cuántas opciones te sirven de todas las que existen.",example:"Con 1 premio en 10 sobres, tu probabilidad es 1/10."}
];
const variants=[
{id:101,skill:"Porcentajes",q:"Un polerón cuesta $30.000 y tiene 20% de descuento. ¿Cuánto pagarás?",options:["$6.000","$24.000","$26.000","$28.000"],answer:1,explanations:["Eso es el descuento, pero falta restarlo.","¡Buena! El descuento es $6.000 y pagas $24.000.","El descuento es $6.000, no $4.000.","El descuento es $6.000, no $2.000."],steps:["Calcula el 20%: 30.000 × 0,20 = 6.000.","Resta el descuento: 30.000 − 6.000 = 24.000."],easy:"20% es la quinta parte; una quinta parte de 30.000 es 6.000.",example:"Si algo cuesta $10.000 y tiene 20% de descuento, terminas pagando $8.000."},
{id:102,skill:"Ecuaciones",q:"Si 4x − 8 = 20, ¿cuánto vale x?",options:["3","5","7","12"],answer:2,explanations:["Recuerda sumar 8 y luego dividir por 4.","Al sumar 8 obtienes 28, que debes dividir por 4.","¡Correcto! 4 × 7 − 8 = 20.","28 es el valor de 4x, no de x."],steps:["Suma 8 a ambos lados: 4x = 28.","Divide ambos lados por 4: x = 7.","Comprueba sustituyendo x por 7."],easy:"Primero deshaz la resta y luego la multiplicación.",example:"Cuatro entradas, menos un descuento de $8, cuestan $20: cada una vale $7."},
{id:103,skill:"Proporcionalidad",q:"Tres entradas cuestan $12.000. ¿Cuánto cuestan cinco entradas al mismo precio?",options:["$15.000","$18.000","$20.000","$24.000"],answer:2,explanations:["Calcula el valor de una entrada y multiplica por cinco.","Cinco entradas cuestan más: divide 12.000 por 3 y multiplica por 5.","¡Bien! Cada entrada vale $4.000.","Ese valor correspondería a seis entradas."],steps:["Divide $12.000 entre tres: cada entrada vale $4.000.","Multiplica $4.000 por cinco: $20.000."],easy:"Primero descubre cuánto vale una entrada.",example:"Dos cuadernos por $3.000 implican cuatro por $6.000."}];
const extra=[
{id:104,skill:"Porcentajes",q:"Un producto aumenta de $50.000 a $60.000. ¿Qué porcentaje aumentó?",options:["10%","15%","20%","25%"],answer:2,explanations:["Calcula el aumento respecto del original.","Divide el aumento por el precio original.","¡Bien! Aumentó un 20%.","El porcentaje se calcula sobre el original."],steps:["Resta: 60.000 − 50.000 = 10.000.","Divide: 10.000 / 50.000 = 0,2.","Multiplica por 100: 20%."],easy:"Diez mil es una quinta parte de cincuenta mil.",example:"De $100 a $120 hay un aumento del 20%."},
{id:105,skill:"Probabilidad",q:"Al lanzar un dado común, ¿cuál es la probabilidad de obtener un número par?",options:["1/6","1/3","1/2","2/3"],answer:2,explanations:["Hay tres resultados pares.","Los pares son 2, 4 y 6.","¡Bien! Tres de seis equivale a la mitad.","Cuenta los pares: 2, 4, 6."],steps:["Cuenta tres casos favorables: 2, 4, 6.","Existen seis resultados posibles.","3/6 = 1/2."],easy:"La mitad de las caras del dado son números pares.",example:"Tres bolitas de seis representan la mitad."}
];
const expansion=[{"id":106,"skill":"Geometría","q":"Un rectángulo mide 8 cm de largo y 5 cm de ancho. ¿Cuál es su área?","options":["13 cm²","26 cm²","40 cm²","80 cm²"],"answer":2,"explanations":["Sumaste largo y ancho; el área se obtiene multiplicándolos.","Ese resultado corresponde al perímetro.","¡Cachaste! 8 × 5 = 40 cm².","Revisa la multiplicación: 8 × 5 no da 80."],"steps":["Área del rectángulo = largo × ancho.","Multiplica 8 × 5 = 40.","Expresa el resultado en centímetros cuadrados (cm²)."],"easy":"El área es el espacio que ocupa la superficie. Imagina 5 filas de 8 cuadraditos.","example":"Un piso de 3 m por 2 m tiene un área de 6 m²."},{"id":107,"skill":"Geometría","q":"Un triángulo tiene base 10 cm y altura perpendicular de 6 cm. ¿Cuál es su área?","options":["16 cm²","30 cm²","60 cm²","120 cm²"],"answer":1,"explanations":["Sumar base y altura no entrega el área.","¡Bien! (10 × 6) ÷ 2 = 30 cm².","Te faltó dividir por 2.","Multiplicaste en vez de dividir por 2."],"steps":["Calcula base × altura: 10 × 6 = 60.","Divide entre 2: 60 ÷ 2 = 30.","Expresa 30 cm²."],"easy":"Dos triángulos iguales pueden formar un rectángulo de 10 por 6; uno tiene la mitad de su área.","example":"Con base 4 y altura 3, el área triangular es 6 unidades cuadradas."},{"id":108,"skill":"Estadística","q":"Las notas de un grupo son 4, 5, 6, 5 y 5. ¿Cuál es la moda?","options":["4","5","6","25"],"answer":1,"explanations":["El 4 aparece una sola vez.","¡Cachaste! El 5 es el valor que más se repite.","El 6 aparece una sola vez.","25 es la suma de los datos, no la moda."],"steps":["Cuenta cuántas veces aparece cada valor.","El 4 aparece una vez, el 5 tres veces y el 6 una vez.","La moda es 5."],"easy":"La moda es el dato más frecuente. No necesitas sumar ni dividir.","example":"En 2, 3, 3, 4, la moda es 3."},{"id":109,"skill":"Estadística","q":"Los tiempos de estudio de cuatro estudiantes son 20, 30, 40 y 50 minutos. ¿Cuál es el promedio?","options":["30 minutos","35 minutos","40 minutos","140 minutos"],"answer":1,"explanations":["Revisa la suma total y la cantidad de estudiantes.","¡Correcto! 140 ÷ 4 = 35 minutos.","Ese es uno de los datos, no el promedio.","140 es la suma, todavía debes dividir entre cuatro."],"steps":["Suma los tiempos: 20 + 30 + 40 + 50 = 140.","Hay cuatro estudiantes.","Divide 140 ÷ 4 = 35 minutos."],"easy":"El promedio reparte el total en partes iguales entre todos los estudiantes.","example":"De 10 y 20, el promedio es (10+20)÷2=15."},{"id":110,"skill":"Geometría","q":"Una plaza cuadrada tiene lados de 7 metros. ¿Cuál es su perímetro?","options":["14 m","21 m","28 m","49 m"],"answer":2,"explanations":["Contaste solo dos lados.","Un cuadrado tiene cuatro lados iguales, no tres.","¡Bien! 7 × 4 = 28 m.","49 m² sería su área, no su perímetro."],"steps":["El perímetro es la distancia alrededor de la figura.","Un cuadrado tiene cuatro lados de 7 m.","Suma 7+7+7+7=28 m."],"easy":"Imagina que caminas todo el borde de la plaza: recorres cuatro lados iguales.","example":"Un cuadrado de lado 3 cm tiene perímetro de 12 cm."},{"id":111,"skill":"Estadística","q":"En un curso, 8 estudiantes van caminando, 12 en bus y 5 en bicicleta. ¿Cuántos estudiantes fueron encuestados?","options":["12","20","25","30"],"answer":2,"explanations":["Debes contar los tres grupos.","Falta incluir a quienes usan bicicleta.","¡Cachaste! 8 + 12 + 5 = 25.","Revisa la suma de los tres grupos."],"steps":["Identifica todas las categorías: caminando, bus y bicicleta.","Suma 8 + 12 + 5.","El total es 25 estudiantes."],"easy":"Cada estudiante pertenece a uno de los tres grupos. Para saber cuántos son, los juntas.","example":"Si 3 prefieren té y 4 café, entrevistaste a 7 personas."}];
const challenges=[{"id":112,"skill":"Porcentajes","q":"Una entrada sube de $8.000 a $10.000. ¿En qué porcentaje aumentó respecto al precio original?","options":["20%","25%","80%","125%"],"answer":1,"explanations":["Calculaste el aumento usando el precio nuevo como referencia.","¡Cachaste! El alza de $2.000 es 25% de $8.000.","Este porcentaje corresponde al precio original sobre el nuevo.","125% es lo que representa el precio final respecto al inicial, no solo el aumento."],"steps":["Calcula cuánto subió: $10.000 − $8.000 = $2.000.","Divide el aumento por el precio ORIGINAL: 2.000 ÷ 8.000 = 0,25.","Convierte a porcentaje: 0,25 × 100 = 25%."],"easy":"Compara los $2.000 extra con los $8.000 de antes, no con los $10.000 de después.","example":"Si algo sube de $100 a $120, aumenta $20 sobre $100: 20%."},{"id":113,"skill":"Ecuaciones","q":"Un viaje en aplicación cobra $1.200 fijos más $450 por kilómetro. Si pagaste $4.350, ¿cuántos kilómetros recorriste?","options":["5 km","7 km","9 km","12 km"],"answer":1,"explanations":["Primero descuenta la tarifa fija del total.","¡Bien! (4.350 − 1.200) ÷ 450 = 7 km.","Olvidaste descontar el costo fijo antes de dividir.","El valor del viaje incluye un cobro fijo; no dividas todo por el precio por km."],"steps":["Plantea 1.200 + 450x = 4.350.","Resta 1.200: 450x = 3.150.","Divide por 450: x = 7 km."],"easy":"Del total, una parte se paga aunque no recorras nada. Quita esa parte para calcular solo los kilómetros.","example":"Un estacionamiento cobra $1.000 de entrada y $500 por hora; si pagas $2.000, estuviste 2 horas."},{"id":114,"skill":"Geometría","q":"Un patio mide 12 m por 8 m. En una esquina hay un jardín cuadrado de 3 m por 3 m que no se pavimentará. ¿Cuántos m² se pavimentarán?","options":["87 m²","93 m²","96 m²","105 m²"],"answer":0,"explanations":["¡Cachaste! El patio mide 96 m² y el jardín ocupa 9 m²; quedan 87 m².","El jardín mide 9 m², no 3 m².","Ese es el patio completo; aún debes descontar el jardín.","Sumaste el jardín en vez de descontarlo."],"steps":["Área del patio: 12 × 8 = 96 m².","Área del jardín: 3 × 3 = 9 m².","Superficie a pavimentar: 96 − 9 = 87 m²."],"easy":"Primero calcula toda la superficie; después quita el pedazo que no se va a cubrir.","example":"Una pieza de 20 m² con un clóset de 2 m² deja 18 m² libres."},{"id":115,"skill":"Estadística","q":"En un registro aparecen estos tiempos de espera: 8, 10, 12, 15 y 40 minutos. ¿Cuál es la mediana?","options":["10 minutos","12 minutos","17 minutos","40 minutos"],"answer":1,"explanations":["El 10 queda antes del dato central.","¡Bien! Con cinco datos ordenados, la mediana es el tercero: 12.","17 es el promedio (85 ÷ 5), no la mediana.","El valor máximo no corresponde al dato central."],"steps":["Ordena los cinco datos de menor a mayor: 8, 10, 12, 15, 40.","Ubica la posición central: la tercera de cinco.","La mediana es 12 minutos."],"easy":"La mediana es el número que queda justo al medio cuando ordenas los datos. No importa que uno sea mucho más grande.","example":"En 1, 2, 100 la mediana es 2, aunque el promedio es mayor."}];
const bankRegularA=[{"id":200,"axis":"Números","skill":"Enteros","topic":"Operaciones","q":"En una ciudad había 4 °C. La temperatura bajó 9 °C y después subió 3 °C. ¿Cuál fue la temperatura final?","options":["−8 °C","−2 °C","2 °C","16 °C"],"answer":1,"explanations":["Olvidaste sumar el último aumento.","¡Cachaste! −5 + 3 = −2 °C.","Al bajar nueve grados desde cuatro se pasa bajo cero.","No se suman todas las variaciones como aumentos."],"steps":["4 − 9 = −5 °C.","−5 + 3 = −2 °C."],"easy":"Una disminución se representa con un número negativo.","example":"Si estás en 1 °C y baja 4 °C, terminas en −3 °C.","level":"avanzado","origin":"original"},{"id":201,"axis":"Números","skill":"Enteros","topic":"Orden","q":"¿Cuál de estos números es el menor?","options":["−3","−12","0","5"],"answer":1,"explanations":["−12 está más a la izquierda que −3.","¡Cachaste! Entre −12 y −3, el menor es −12.","Los negativos son menores que cero.","Todos los negativos son menores que cinco."],"steps":["En una recta numérica el menor está más a la izquierda.","Entre −12 y −3, el menor es −12."],"easy":"El más negativo es el menor, aunque su valor absoluto sea grande.","example":"−7 es menor que −2.","level":"intermedio","origin":"original"},{"id":202,"axis":"Números","skill":"Enteros","topic":"Operaciones","q":"Una cuenta bancaria tiene saldo de −$5.000. Depositas $13.000 y luego retiras $2.000. ¿Cuál es el saldo?","options":["$6.000","$10.000","−$6.000","$16.000"],"answer":0,"explanations":["¡Cachaste! 8.000 − 2.000 = 6.000 pesos.","Olvidaste la deuda inicial o el retiro.","El depósito supera la deuda, por lo que queda saldo positivo.","Revisa que partir de saldo negativo resta $5.000."],"steps":["−5.000 + 13.000 = 8.000.","8.000 − 2.000 = 6.000 pesos."],"easy":"Una deuda es saldo negativo: paga primero la deuda antes de contar el dinero restante.","example":"Si debes $3.000 y depositas $5.000, quedan $2.000.","level":"inicial","origin":"original"},{"id":203,"axis":"Números","skill":"Racionales","topic":"Suma fracciones","q":"¿Cuánto es 1/2 + 1/4?","options":["2/6","2/4","3/4","1/8"],"answer":2,"explanations":["No se suman los denominadores.","Convierte primero 1/2 en 2/4.","¡Cachaste! Suma 2/4 + 1/4 = 3/4.","Multiplicar los denominadores no entrega la suma."],"steps":["Expresa 1/2 como 2/4.","Suma 2/4 + 1/4 = 3/4."],"easy":"Busca partes del mismo tamaño antes de sumar.","example":"1/3 + 1/3 = 2/3.","level":"avanzado","origin":"original"},{"id":204,"axis":"Números","skill":"Racionales","topic":"Multiplicación fracciones","q":"Una receta necesita 3/4 de taza de leche. Prepararás solo la mitad. ¿Cuánta leche necesitas?","options":["3/8 taza","3/6 taza","3/2 tazas","1/4 taza"],"answer":0,"explanations":["¡Cachaste! Necesitas 3/8 de taza.","Para hallar la mitad de 3/4, multiplica por 1/2.","Tomar la mitad debe dar menos que 3/4.","3/8 no es 1/4: revisa el numerador."],"steps":["Multiplica 3/4 × 1/2.","Numeradores: 3 × 1 = 3; denominadores: 4 × 2 = 8.","Necesitas 3/8 de taza."],"easy":"La mitad de una fracción es la fracción multiplicada por 1/2.","example":"La mitad de 2/3 es 1/3.","level":"intermedio","origin":"original"},{"id":205,"axis":"Números","skill":"Racionales","topic":"Comparación","q":"¿Cuál fracción es mayor?","options":["3/5","2/3","5/9","1/2"],"answer":1,"explanations":["3/5 = 0,6 y 2/3 es aproximadamente 0,667.","¡Cachaste! 10/15 es mayor que 9/15 y también que las otras opciones.","5/9 es aproximadamente 0,556.","1/2 es 0,5."],"steps":["Compara con un denominador común: 3/5 = 9/15 y 2/3 = 10/15.","10/15 es mayor que 9/15 y también que las otras opciones."],"easy":"Compara fracciones usando decimales o denominadores comunes.","example":"1/2 = 0,5 y 3/4 = 0,75; gana 3/4.","level":"inicial","origin":"original"},{"id":206,"axis":"Números","skill":"Porcentajes","topic":"Variaciones sucesivas","q":"Un artículo cuesta $20.000. Sube 10% y luego baja 10% sobre el nuevo precio. ¿Cuánto cuesta al final?","options":["$20.000","$19.800","$18.000","$22.000"],"answer":1,"explanations":["Los cambios no se anulan porque usan bases distintas.","¡Cachaste! Después de la baja: 22.000 × 0,90 = 19.800.","Solo aplicaste la disminución del 10%.","Solo aplicaste el aumento del 10%."],"steps":["Después del aumento: 20.000 × 1,10 = 22.000.","Después de la baja: 22.000 × 0,90 = 19.800."],"easy":"El segundo porcentaje se aplica al precio ya aumentado.","example":"Si 100 sube 20% y baja 20%, termina en 96.","level":"avanzado","origin":"original"},{"id":207,"axis":"Números","skill":"Porcentajes","topic":"Interpretación","q":"De 240 estudiantes, el 30% practica algún deporte. ¿Cuántos estudiantes son?","options":["24","60","72","80"],"answer":2,"explanations":["24 es el 10% de 240.","60 es el 25% de 240.","¡Cachaste! 240 × 0,30 = 72 estudiantes.","80 corresponde a un tercio, no al 30%."],"steps":["30% = 0,30.","240 × 0,30 = 72 estudiantes."],"easy":"Puedes calcular primero el 10% (24) y multiplicarlo por tres.","example":"El 30% de 100 es 30.","level":"intermedio","origin":"original"},{"id":208,"axis":"Números","skill":"Porcentajes","topic":"Porcentaje inverso","q":"Después de un descuento de 20%, un producto vale $16.000. ¿Cuál era su precio original?","options":["$12.800","$18.000","$19.200","$20.000"],"answer":3,"explanations":["Aplicaste otro descuento en lugar de recuperar el valor inicial.","Sumar 20% de 16.000 no recupera el precio original.","Tomaste el porcentaje sobre la base equivocada.","¡Cachaste! Divide 16.000 ÷ 0,8 = 20.000."],"steps":["El precio descontado corresponde al 80% del original.","Divide 16.000 ÷ 0,8 = 20.000."],"easy":"Si queda el 80%, divide por 0,8 para obtener el 100%.","example":"Si el 50% son $5.000, el total son $10.000.","level":"inicial","origin":"original"},{"id":209,"axis":"Números","skill":"Potencias","topic":"Producto de potencias","q":"¿Cuál es una forma equivalente de 2³ × 2² usando una sola potencia?","options":["2⁵","2⁶","4⁵","2¹"],"answer":0,"explanations":["¡Cachaste! Resultado: 2⁵ = 32.","Al multiplicar potencias de igual base se suman exponentes, no se multiplican.","La base se conserva igual.","No se restan los exponentes."],"steps":["Con igual base, suma los exponentes: 3 + 2 = 5.","Resultado: 2⁵ = 32."],"easy":"Tres factores 2, multiplicados por otros dos factores 2, son cinco factores 2.","example":"3² × 3³ = 3⁵.","level":"avanzado","origin":"original"},{"id":210,"axis":"Números","skill":"Potencias","topic":"Exponente negativo","q":"¿Cuánto vale 2⁻³?","options":["−8","−1/8","1/8","8"],"answer":2,"explanations":["Un exponente negativo no vuelve negativo el resultado.","La base 2 es positiva: el resultado también.","¡Cachaste! 2³ = 8, por tanto 2⁻³ = 1/8.","El exponente negativo indica el inverso."],"steps":["2⁻³ = 1/(2³).","2³ = 8, por tanto 2⁻³ = 1/8."],"easy":"El signo menos en el exponente significa invertir, no cambiar de signo.","example":"5⁻¹ = 1/5.","level":"intermedio","origin":"original"},{"id":211,"axis":"Números","skill":"Potencias","topic":"Raíz cuadrada","q":"¿Cuál es el valor de √144?","options":["11","12","24","72"],"answer":1,"explanations":["11 × 11 = 121.","¡Cachaste! 12 × 12 = 144, así que √144 = 12.","24 × 24 es mucho mayor que 144.","Dividir 144 por 2 no calcula su raíz."],"steps":["Busca un número positivo que multiplicado por sí mismo dé 144.","12 × 12 = 144, así que √144 = 12."],"easy":"La raíz cuadrada deshace el cuadrado.","example":"√81 = 9.","level":"inicial","origin":"original"},{"id":212,"axis":"Números","skill":"Raíces","topic":"Raíz cúbica","q":"¿Cuál es el valor de ∛125?","options":["4","5","10","25"],"answer":1,"explanations":["4³ = 64.","¡Cachaste! 5 × 5 × 5 = 125, por eso ∛125 = 5.","10³ = 1.000.","25³ es mayor que 125."],"steps":["Busca qué número multiplicado tres veces por sí mismo produce 125.","5 × 5 × 5 = 125, por eso ∛125 = 5."],"easy":"Para una raíz cúbica piensa en cubos perfectos.","example":"∛27 = 3.","level":"avanzado","origin":"original"},{"id":213,"axis":"Números","skill":"Raíces","topic":"Propiedades","q":"Simplifica √50 como producto de un entero y una raíz.","options":["25√2","10√5","2√25","5√2"],"answer":3,"explanations":["√50 no equivale a 25√2.","10√5 al cuadrado da 500.","2√25 = 10, que no es √50.","¡Cachaste! √50 = √25 × √2 = 5√2."],"steps":["Descompón 50 = 25 × 2.","√50 = √25 × √2 = 5√2."],"easy":"Busca el cuadrado perfecto más grande que divide al número.","example":"√18 = √(9 × 2) = 3√2.","level":"intermedio","origin":"original"},{"id":214,"axis":"Álgebra y funciones","skill":"Álgebra","topic":"Productos notables","q":"¿Cuál es el desarrollo correcto de (x + 3)²?","options":["x² + 9","x² + 6x + 9","x² + 3x + 9","2x + 6"],"answer":1,"explanations":["Falta el término del medio, 6x.","¡Cachaste! Multiplica: x² + 3x + 3x + 9 = x² + 6x + 9.","El término del medio es dos veces x por 3.","Un cuadrado de binomio genera un término x²."],"steps":["(x+3)² = (x+3)(x+3).","Multiplica: x² + 3x + 3x + 9 = x² + 6x + 9."],"easy":"No olvides multiplicar los términos cruzados.","example":"(x+2)² = x²+4x+4.","level":"inicial","origin":"original"},{"id":215,"axis":"Álgebra y funciones","skill":"Álgebra","topic":"Factorización","q":"¿Cuál es la factorización de x² − 16?","options":["(x−4)(x+4)","(x−8)(x+2)","(x−4)²","(x−16)(x+1)"],"answer":0,"explanations":["¡Cachaste! Aplica a²−b² = (a−b)(a+b).","Al expandir no se obtiene x²−16.","(x−4)² genera también −8x.","Al expandir aparecen términos en x que no se cancelan."],"steps":["Reconoce diferencia de cuadrados: x² − 4².","Aplica a²−b² = (a−b)(a+b)."],"easy":"Una resta de dos cuadrados se transforma en dos paréntesis con signos opuestos.","example":"y²−9=(y−3)(y+3).","level":"avanzado","origin":"original"},{"id":216,"axis":"Álgebra y funciones","skill":"Álgebra","topic":"Reducción de términos","q":"Simplifica 3x + 2y − x + 4y.","options":["2x + 6y","4x + 6y","2x + 2y","8xy"],"answer":0,"explanations":["¡Cachaste! Obtienes 2x + 6y.","3x−x es 2x, no 4x.","En las y se suman 2y y 4y.","No se multiplican las variables al reunir términos."],"steps":["Agrupa variables iguales: (3x−x) + (2y+4y).","Obtienes 2x + 6y."],"easy":"Solo se combinan términos con las mismas letras y exponentes.","example":"5a−2a+3b = 3a+3b.","level":"intermedio","origin":"original"},{"id":217,"axis":"Álgebra y funciones","skill":"Álgebra","topic":"Sustitución","q":"Si a=2 y b=−3, ¿cuánto vale a² − 2b?","options":["−2","1","10","14"],"answer":2,"explanations":["a² es 4 y −2b aporta 6, no −6.","El signo menos antes de b debe aplicarse al valor negativo.","¡Cachaste! 4 + 6 = 10.","Revisa 2b: −2×(−3)=6, no 10."],"steps":["Sustituye: 2² − 2(−3).","4 + 6 = 10."],"easy":"Multiplicar dos signos negativos da positivo.","example":"Si b=−2, entonces −3b=6.","level":"inicial","origin":"original"}];
const bankRegularB=[{"id":218,"axis":"Álgebra y funciones","skill":"Proporcionalidad","topic":"Inversa","q":"Seis personas pintan un muro en 8 horas. Si todas trabajan al mismo ritmo, ¿cuánto tardarían 12 personas?","options":["4 horas","6 horas","8 horas","16 horas"],"answer":0,"explanations":["¡Cachaste! 48 ÷ 12 = 4 horas.","Al duplicar trabajadores, el tiempo se reduce a la mitad.","No mantiene el tiempo al duplicarse la cantidad de personas.","En proporcionalidad inversa no se duplica también el tiempo."],"steps":["El trabajo total equivale a 6 × 8 = 48 horas-persona.","48 ÷ 12 = 4 horas."],"easy":"Más trabajadores para la misma tarea implica menos tiempo.","example":"Si 2 personas tardan 10 horas, 4 personas tardan 5 horas, si todo es proporcional.","level":"intermedio","origin":"original"},{"id":219,"axis":"Álgebra y funciones","skill":"Proporcionalidad","topic":"Directa","q":"Para preparar 15 panes se usan 600 g de harina. ¿Cuánta harina se necesita para 25 panes iguales?","options":["750 g","900 g","1.000 g","1.200 g"],"answer":2,"explanations":["Calcula el valor para un pan antes de multiplicar por 25.","600 ÷ 15 es 40, no 36.","¡Cachaste! Para 25 panes: 25 × 40 = 1.000 g.","Esa cantidad produciría 30 panes."],"steps":["Por cada pan: 600 ÷ 15 = 40 g.","Para 25 panes: 25 × 40 = 1.000 g."],"easy":"Primero pasa a una unidad, luego a la cantidad pedida.","example":"4 panes con 200 g significan 50 g por pan.","level":"intermedio","origin":"original"},{"id":220,"axis":"Álgebra y funciones","skill":"Proporcionalidad","topic":"Escala","q":"En un mapa a escala 1:50.000, dos puntos están separados por 3 cm. ¿Cuál es su distancia real?","options":["150 m","1,5 km","15 km","150 km"],"answer":1,"explanations":["3 × 50.000 = 150.000 cm, no 150 m.","¡Cachaste! 150.000 cm = 1.500 m = 1,5 km.","Revisa la conversión de centímetros a kilómetros.","La escala se multiplica por 3, pero no representa 150 km."],"steps":["3 cm representan 3 × 50.000 = 150.000 cm.","150.000 cm = 1.500 m = 1,5 km."],"easy":"Una escala 1:n significa que 1 cm equivale a n cm reales.","example":"A 1:100.000, un centímetro representa un kilómetro.","level":"intermedio","origin":"original"},{"id":221,"axis":"Álgebra y funciones","skill":"Ecuaciones","topic":"Ecuación con paréntesis","q":"Resuelve 2(x + 4) = 18. ¿Cuánto vale x?","options":["5","7","9","14"],"answer":0,"explanations":["¡Cachaste! Resta 4: x = 5.","Antes de despejar, resta 4 después de dividir por 2.","9 es x+4, no x.","Distribuir el 2 no significa sumar 4 directamente."],"steps":["Divide por 2: x + 4 = 9.","Resta 4: x = 5."],"easy":"Deshaz las operaciones en sentido inverso.","example":"Si 3(x+1)=12, entonces x=3.","level":"intermedio","origin":"original"},{"id":222,"axis":"Álgebra y funciones","skill":"Ecuaciones","topic":"Ecuación contextual","q":"Un plan mensual cuesta $3.500 más $250 por cada mensaje extra. La cuenta fue de $5.500. ¿Cuántos mensajes extra hubo?","options":["4","6","8","10"],"answer":2,"explanations":["Descuenta el cargo fijo antes de dividir.","La diferencia es $2.000, no $1.500.","¡Cachaste! Mensajes: 2.000 ÷ 250 = 8.","10 mensajes costarían $2.500 adicionales."],"steps":["Costo variable: 5.500 − 3.500 = 2.000.","Mensajes: 2.000 ÷ 250 = 8."],"easy":"Identifica qué parte del precio es fija y qué parte depende de la cantidad.","example":"Un cargo fijo de 100 y 20 por uso, con total 160, implica tres usos.","level":"intermedio","origin":"original"},{"id":223,"axis":"Álgebra y funciones","skill":"Inecuaciones","topic":"Desigualdad","q":"Si 3x + 2 < 14, ¿qué condición debe cumplir x?","options":["x < 4","x > 4","x < 6","x > 6"],"answer":0,"explanations":["¡Cachaste! Divide por 3 (positivo): x < 4.","El sentido de la desigualdad no cambia al dividir por un número positivo.","Después de restar 2 queda 3x<12, no 18.","Revisa tanto el despeje como el sentido de <."],"steps":["Resta 2: 3x < 12.","Divide por 3 (positivo): x < 4."],"easy":"Cuando divides por un número positivo, mantienes el signo.","example":"2x<10 significa x<5.","level":"intermedio","origin":"original"},{"id":224,"axis":"Álgebra y funciones","skill":"Inecuaciones","topic":"División negativa","q":"Resuelve −2x > 8.","options":["x > −4","x < −4","x > 4","x < 4"],"answer":1,"explanations":["Al dividir por −2 se invierte el signo.","¡Cachaste! Obtienes x < −4.","El resultado es negativo: 8 ÷ (−2) = −4.","Además de invertir el signo, cuida el signo de −4."],"steps":["Divide ambos lados por −2.","Como divides por un negativo, cambia > por <.","Obtienes x < −4."],"easy":"Al multiplicar o dividir una desigualdad por un negativo, la flecha cambia.","example":"−x>3 equivale a x<−3.","level":"intermedio","origin":"original"},{"id":225,"axis":"Álgebra y funciones","skill":"Sistemas 2×2","topic":"Eliminación","q":"Si x + y = 9 y x − y = 3, ¿cuánto vale x?","options":["3","4","6","9"],"answer":2,"explanations":["Ese es el valor de y.","Prueba sumando las dos ecuaciones para eliminar y.","¡Cachaste! Divide por 2: x = 6; entonces y = 3.","x+y=9 no implica que x=9."],"steps":["Suma ambas ecuaciones: 2x = 12.","Divide por 2: x = 6; entonces y = 3."],"easy":"Sumando dos ecuaciones a veces una incógnita desaparece.","example":"Si x+y=8 y x−y=2, entonces x=5.","level":"intermedio","origin":"original"},{"id":226,"axis":"Álgebra y funciones","skill":"Sistemas 2×2","topic":"Problema de entradas","q":"Dos entradas de adulto y una infantil cuestan $19.000. Una de adulto y una infantil cuestan $11.000. ¿Cuánto cuesta la de adulto?","options":["$7.000","$8.000","$9.000","$11.000"],"answer":1,"explanations":["La diferencia entre ambas compras da el precio adulto.","¡Cachaste! La diferencia es una entrada de adulto.","Revisa cuánto cambia el precio cuando agregas un adulto.","$11.000 es la suma de adulto e infantil."],"steps":["Resta el segundo total al primero: 19.000 − 11.000 = 8.000.","La diferencia es una entrada de adulto."],"easy":"Cuando dos compras difieren solo en una cosa, resta sus precios.","example":"Si dos cafés y un té cuestan 7, y un café y un té cuestan 4, el café cuesta 3.","level":"intermedio","origin":"original"},{"id":227,"axis":"Álgebra y funciones","skill":"Función afín","topic":"Evaluación","q":"Una empresa cobra f(x)=2.500+800x pesos por x kilómetros. ¿Cuánto cobra por 6 kilómetros?","options":["$4.800","$7.300","$8.100","$15.000"],"answer":1,"explanations":["$4.800 es solo el costo variable.","¡Cachaste! f(6)=2.500+4.800=$7.300.","Sumaste o multiplicaste incorrectamente alguno de los términos.","Revisa que el cargo fijo es $2.500, no se multiplica por seis."],"steps":["Sustituye x=6: f(6)=2.500+800×6.","f(6)=2.500+4.800=$7.300."],"easy":"En una función afín hay un pago inicial y otro por cada unidad.","example":"Si f(x)=100+20x, entonces f(3)=160.","level":"intermedio","origin":"original"},{"id":228,"axis":"Álgebra y funciones","skill":"Función afín","topic":"Pendiente","q":"Una función afín pasa por los puntos (0,3) y (2,7). ¿Cuál es su pendiente?","options":["1","2","3","4"],"answer":1,"explanations":["La pendiente compara cuánto cambia y por cada unidad de x.","¡Cachaste! Pendiente = 4÷2=2.","3 es la intersección con el eje y.","Dividiste el cambio en y sin considerar el de x."],"steps":["Cambio vertical: 7−3=4; horizontal: 2−0=2.","Pendiente = 4÷2=2."],"easy":"La pendiente mide cuánto sube o baja y cuando x aumenta uno.","example":"De (0,1) a (1,4) la pendiente es 3.","level":"intermedio","origin":"original"},{"id":229,"axis":"Álgebra y funciones","skill":"Función afín","topic":"Tabla","q":"Si f(x)=3x−2, ¿cuál es el valor de f(−1)?","options":["−5","−1","1","5"],"answer":0,"explanations":["¡Cachaste! −3−2=−5.","Recuerda multiplicar 3 por −1 antes de restar 2.","El resultado debe ser menor que −3 al restar 2.","Ignoraste que el argumento es negativo."],"steps":["Sustituye x=−1: f(−1)=3(−1)−2.","−3−2=−5."],"easy":"Reemplaza x por el número entre paréntesis y respeta los signos.","example":"Si g(x)=2x+1, g(−2)=−3.","level":"intermedio","origin":"original"},{"id":230,"axis":"Álgebra y funciones","skill":"Función cuadrática","topic":"Raíces","q":"¿Qué valores de x hacen que x²−9=0?","options":["x=3 solamente","x=−3 solamente","x=−3 y x=3","x=0 y x=9"],"answer":2,"explanations":["Elevar −3 al cuadrado también da 9.","También 3²=9.","¡Cachaste! Tanto 3² como (−3)² valen 9: x=−3 o x=3.","Cero y nueve no cumplen x²=9."],"steps":["Despeja x²=9.","Tanto 3² como (−3)² valen 9: x=−3 o x=3."],"easy":"Al resolver un cuadrado igual a un número positivo, revisa los dos signos.","example":"x²=16 tiene soluciones 4 y −4.","level":"intermedio","origin":"original"},{"id":231,"axis":"Álgebra y funciones","skill":"Función cuadrática","topic":"Vértice","q":"La altura de una pelota se modela con h(t)=−(t−3)²+9. ¿En qué instante alcanza su altura máxima?","options":["t=0","t=3","t=6","t=9"],"answer":1,"explanations":["Cuando t=0, h=0.","¡Cachaste! Aquí p=3 y el coeficiente es negativo: el máximo ocurre en t=3.","En t=6 vuelve a bajar a altura cero.","El 9 es la altura máxima, no el instante."],"steps":["La forma h(t)=a(t−p)²+q tiene vértice en t=p.","Aquí p=3 y el coeficiente es negativo: el máximo ocurre en t=3."],"easy":"En una parábola hacia abajo, el vértice es el punto más alto.","example":"f(x)=−(x−2)²+5 alcanza su máximo en x=2.","level":"intermedio","origin":"original"},{"id":232,"axis":"Álgebra y funciones","skill":"Función cuadrática","topic":"Parábola","q":"Para f(x)=x²−4x+3, ¿cuál es el valor mínimo de la función?","options":["−1","0","1","3"],"answer":0,"explanations":["¡Cachaste! f(2)=4−8+3=−1; al abrir hacia arriba, es el mínimo.","El mínimo no es cero: hay valores negativos entre las raíces.","El vértice está en x=2, pero el valor es −1.","3 corresponde a f(0), no al mínimo."],"steps":["El vértice está en x=−b/(2a)=4/2=2.","f(2)=4−8+3=−1; al abrir hacia arriba, es el mínimo."],"easy":"Para encontrar el mínimo de una parábola hacia arriba, busca su vértice.","example":"f(x)=(x−1)²+2 tiene mínimo 2.","level":"intermedio","origin":"original"}];
const bankRegularC=[{"id":233,"axis":"Geometría","skill":"Pitágoras","topic":"Triángulo rectángulo","q":"Una escalera de 5 m se apoya en una pared y su base está a 3 m del muro. ¿Qué altura alcanza?","options":["2 m","3 m","4 m","8 m"],"answer":2,"explanations":["La altura no se obtiene restando directamente 5−3.","3 m es la distancia horizontal.","¡Cachaste! h²=25−9=16, entonces h=4 m.","La altura no puede superar los 5 m de escalera."],"steps":["La escalera es la hipotenusa: h²+3²=5².","h²=25−9=16, entonces h=4 m."],"easy":"En un triángulo rectángulo, hipotenusa² = cateto² + cateto².","example":"En un triángulo 3,4,5, si conoces 5 y 4, el otro lado es 3.","level":"intermedio","origin":"original"},{"id":234,"axis":"Geometría","skill":"Pitágoras","topic":"Diagonal","q":"Una pantalla rectangular mide 6 unidades de ancho y 8 de alto. ¿Cuánto mide su diagonal?","options":["7","10","14","48"],"answer":1,"explanations":["La diagonal es mayor que cada lado, no menor que ocho.","¡Cachaste! d=√100=10.","Sumar ambos lados no calcula la diagonal.","48 es el área, no la diagonal."],"steps":["d²=6²+8²=36+64=100.","d=√100=10."],"easy":"La diagonal es la hipotenusa del triángulo que forman ancho y alto.","example":"Un rectángulo de 3 por 4 tiene diagonal 5.","level":"intermedio","origin":"original"},{"id":235,"axis":"Geometría","skill":"Pitágoras","topic":"Problema inverso","q":"Un triángulo rectángulo tiene hipotenusa 13 cm y un cateto de 12 cm. ¿Cuánto mide el otro cateto?","options":["1 cm","5 cm","12,5 cm","25 cm"],"answer":1,"explanations":["No basta restar longitudes.","¡Cachaste! Cateto=√25=5 cm.","La raíz de 13²−12² no es 12,5.","El resultado 25 corresponde al cuadrado del cateto faltante."],"steps":["Cateto²=13²−12²=169−144=25.","Cateto=√25=5 cm."],"easy":"Resta los cuadrados y luego saca raíz.","example":"Si hipotenusa 10 y un cateto 8, el otro mide 6.","level":"intermedio","origin":"original"},{"id":236,"axis":"Geometría","skill":"Círculos","topic":"Área","q":"Considera π=3,14. ¿Cuál es el área de un círculo de radio 5 cm?","options":["15,7 cm²","31,4 cm²","78,5 cm²","157 cm²"],"answer":2,"explanations":["15,7 es π por radio, faltó elevarlo al cuadrado.","31,4 es la longitud de la circunferencia.","¡Cachaste! A=3,14 × 5² = 3,14 × 25 = 78,5 cm².","Aplicaste un factor 2 adicional."],"steps":["A=πr².","A=3,14 × 5² = 3,14 × 25 = 78,5 cm²."],"easy":"El área usa el radio al cuadrado, no el diámetro.","example":"Con radio 2, área = 4π.","level":"intermedio","origin":"original"},{"id":237,"axis":"Geometría","skill":"Círculos","topic":"Circunferencia","q":"Considera π=3. ¿Cuál es la longitud de una circunferencia de diámetro 8 m?","options":["12 m","16 m","24 m","48 m"],"answer":2,"explanations":["12 es π por radio.","Multiplicaste el diámetro por dos.","¡Cachaste! 3 × 8 = 24 m.","Solo con π por diámetro da 24, no 48."],"steps":["Longitud = π × diámetro.","3 × 8 = 24 m."],"easy":"Para el contorno de un círculo multiplicas el diámetro por π.","example":"Con π=3 y diámetro 4, el contorno mide 12.","level":"intermedio","origin":"original"},{"id":238,"axis":"Geometría","skill":"Polígonos","topic":"Trapecio","q":"Un trapecio tiene bases paralelas de 10 cm y 6 cm, y altura de 4 cm. ¿Cuál es su área?","options":["16 cm²","24 cm²","32 cm²","64 cm²"],"answer":2,"explanations":["Sumaste bases pero no multiplicaste por altura ni dividiste por dos.","Falta usar ambas bases en el cálculo.","¡Cachaste! A=(10+6)×4÷2=32 cm².","Debes dividir por dos el producto (bases sumadas) × altura."],"steps":["A=(B+b)×h÷2.","A=(10+6)×4÷2=32 cm²."],"easy":"Suma ambas bases, multiplica por la altura y saca la mitad.","example":"Bases 4 y 2 con altura 3 producen área 9.","level":"intermedio","origin":"original"},{"id":239,"axis":"Geometría","skill":"Polígonos","topic":"Paralelogramo","q":"Un paralelogramo tiene base de 9 cm y altura perpendicular de 4 cm. ¿Cuál es su área?","options":["13 cm²","18 cm²","36 cm²","72 cm²"],"answer":2,"explanations":["Sumaste base y altura.","No se divide por dos como un triángulo.","¡Cachaste! 9 × 4 = 36 cm².","Duplicaste el área."],"steps":["Área = base × altura perpendicular.","9 × 4 = 36 cm²."],"easy":"Aunque se vea inclinado, su área es base por altura perpendicular.","example":"Base 5 y altura 2: área 10.","level":"intermedio","origin":"original"},{"id":240,"axis":"Geometría","skill":"Cuerpos geométricos","topic":"Volumen cubo","q":"Una caja cúbica tiene aristas de 4 cm. ¿Cuál es su volumen?","options":["12 cm³","16 cm³","48 cm³","64 cm³"],"answer":3,"explanations":["Sumaste tres aristas.","Calculaste 4², no 4³.","Multiplicaste 3×4², que no es el volumen.","¡Cachaste! 4×4×4=64 cm³."],"steps":["Volumen de un cubo = lado³.","4×4×4=64 cm³."],"easy":"Cuenta cuántos cubitos de 1 cm³ caben en largo, ancho y alto.","example":"Un cubo de lado 2 tiene volumen 8.","level":"intermedio","origin":"original"},{"id":241,"axis":"Geometría","skill":"Cuerpos geométricos","topic":"Volumen prisma","q":"Un depósito mide 5 m de largo, 3 m de ancho y 2 m de alto. ¿Cuál es su volumen?","options":["10 m³","15 m³","30 m³","60 m³"],"answer":2,"explanations":["Multiplicaste solo largo y alto.","Multiplicaste solo largo y ancho.","¡Cachaste! 5×3×2=30 m³.","Multiplicaste por dos el volumen correcto."],"steps":["Volumen = largo × ancho × alto.","5×3×2=30 m³."],"easy":"Para el volumen necesitas las tres dimensiones.","example":"Una caja 2×2×3 tiene 12 unidades cúbicas.","level":"intermedio","origin":"original"},{"id":242,"axis":"Geometría","skill":"Cuerpos geométricos","topic":"Superficie cubo","q":"Una caja cúbica de 3 cm de arista se cubrirá completamente con papel. ¿Cuántos cm² se necesitan?","options":["9 cm²","18 cm²","27 cm²","54 cm²"],"answer":3,"explanations":["Eso es el área de una sola cara.","Eso corresponde a dos caras.","27 es volumen, no superficie exterior.","¡Cachaste! El cubo tiene 6 caras: 6×9=54 cm²."],"steps":["Cada cara tiene área 3×3=9 cm².","El cubo tiene 6 caras: 6×9=54 cm²."],"easy":"Para cubrir por fuera cuenta las seis caras, no el espacio interior.","example":"Cubo de lado 2: superficie = 6×4=24.","level":"intermedio","origin":"original"},{"id":243,"axis":"Geometría","skill":"Cilindros","topic":"Volumen","q":"Usa π=3. Un cilindro tiene radio de 2 cm y altura de 5 cm. ¿Cuál es su volumen?","options":["30 cm³","60 cm³","90 cm³","120 cm³"],"answer":1,"explanations":["Usaste r en lugar de r².","¡Cachaste! V=3×2²×5=3×4×5=60 cm³.","Multiplicaste por 3 dos veces.","Duplicaste innecesariamente el volumen."],"steps":["V=π×r²×h.","V=3×2²×5=3×4×5=60 cm³."],"easy":"Imagina una pila de círculos: área de base × altura.","example":"Con π=3, radio 1 y altura 4, volumen 12.","level":"intermedio","origin":"original"},{"id":244,"axis":"Geometría","skill":"Cilindros","topic":"Superficie lateral","q":"Usa π=3. La superficie lateral de un cilindro de radio 4 cm y altura 6 cm se cubrirá con papel. ¿Qué área se necesita solo para el costado?","options":["24 cm²","48 cm²","72 cm²","144 cm²"],"answer":3,"explanations":["Multiplicaste r×h sin usar la circunferencia.","Faltó multiplicar por π o por 2.","Usaste solo la mitad de la circunferencia.","¡Cachaste! 2×3×4×6=144 cm²."],"steps":["Área lateral = 2πrh.","2×3×4×6=144 cm²."],"easy":"Si desenrollas el costado, es un rectángulo de alto h y ancho la circunferencia.","example":"Con π=3, r=1 y h=2, área lateral 12.","level":"intermedio","origin":"original"},{"id":245,"axis":"Geometría","skill":"Transformaciones","topic":"Reflexión","q":"Al reflejar el punto (3,−2) respecto del eje y, ¿dónde queda?","options":["(3,2)","(−3,−2)","(−3,2)","(2,−3)"],"answer":1,"explanations":["Cambiaste y en vez de x.","¡Cachaste! Por tanto (3,−2) pasa a (−3,−2).","Reflejar en el eje y conserva la coordenada vertical.","Intercambiar coordenadas no es reflexión en el eje y."],"steps":["La reflexión en el eje y transforma (x,y) en (−x,y).","Por tanto (3,−2) pasa a (−3,−2)."],"easy":"Una reflexión izquierda-derecha cambia el signo horizontal.","example":"(4,1) reflejado en el eje y es (−4,1).","level":"intermedio","origin":"original"},{"id":246,"axis":"Geometría","skill":"Transformaciones","topic":"Traslación","q":"El punto A=(−1,4) se traslada por el vector (3,−2). ¿Cuál es su nueva posición?","options":["(−4,6)","(2,2)","(2,6)","(−3,1)"],"answer":1,"explanations":["Restaste el vector en lugar de sumarlo.","¡Cachaste! y=4−2=2; punto nuevo (2,2).","Sumaste 2 en la coordenada vertical en vez de restar 2.","Las coordenadas se suman por separado."],"steps":["Suma coordenada a coordenada: x=−1+3=2.","y=4−2=2; punto nuevo (2,2)."],"easy":"Trasladar es sumar el vector a cada coordenada.","example":"(0,1)+(2,3)=(2,4).","level":"intermedio","origin":"original"},{"id":247,"axis":"Geometría","skill":"Transformaciones","topic":"Rotación","q":"Al rotar el punto (2,1) 90° en sentido antihorario alrededor del origen, ¿cuál es su imagen?","options":["(1,−2)","(−1,2)","(−2,−1)","(2,−1)"],"answer":1,"explanations":["Ese corresponde al giro horario de 90°.","¡Cachaste! Con (2,1) obtienes (−1,2).","Esa es rotación de 180°.","Solo cambiaste el signo de y."],"steps":["Una rotación antihoraria de 90° transforma (x,y) en (−y,x).","Con (2,1) obtienes (−1,2)."],"easy":"Al girar un cuarto de vuelta a la izquierda, intercambias coordenadas y niegas la que ahora va primero.","example":"(1,0) gira a (0,1).","level":"intermedio","origin":"original"},{"id":248,"axis":"Geometría","skill":"Semejanza","topic":"Escalas","q":"Un modelo a escala 1:100 muestra una mesa de 1,5 cm de alto. ¿Cuál es la altura real?","options":["0,15 m","1,5 m","15 m","150 m"],"answer":1,"explanations":["1,5×100=150 cm, no 15 cm.","¡Cachaste! 150 cm = 1,5 m.","Debes convertir 150 cm a metros.","150 m multiplica la escala dos veces."],"steps":["Multiplica por 100: 1,5×100=150 cm.","150 cm = 1,5 m."],"easy":"La escala 1:100 convierte centímetros del dibujo en centímetros reales multiplicando por 100.","example":"A escala 1:10, 3 cm representan 30 cm.","level":"intermedio","origin":"original"},{"id":249,"axis":"Geometría","skill":"Semejanza","topic":"Proporción de lados","q":"Dos triángulos son semejantes. El menor tiene lados 3, 4 y 5 cm. El lado correspondiente a 3 cm mide 9 cm en el mayor. ¿Cuánto mide el lado correspondiente a 5 cm?","options":["11 cm","12 cm","15 cm","45 cm"],"answer":2,"explanations":["El factor no se suma a todos los lados.","El factor de escala es 3, así que 4 pasa a 12, pero se pregunta por 5.","¡Cachaste! Lado correspondiente a 5 cm: 5×3=15 cm.","No se multiplica 9×5 directamente."],"steps":["Factor de escala = 9÷3=3.","Lado correspondiente a 5 cm: 5×3=15 cm."],"easy":"En figuras semejantes, todos los lados crecen por el mismo factor.","example":"Si un lado 2 pasa a 6, otro lado de 4 pasa a 12.","level":"intermedio","origin":"original"}];
const bankRegularD=[{"id":250,"axis":"Probabilidad y estadística","skill":"Tablas y gráficos","topic":"Frecuencia relativa","q":"En una encuesta de 40 estudiantes, 12 prefieren estudiar de mañana. ¿Cuál es la frecuencia relativa de esta preferencia?","options":["12%","30%","40%","70%"],"answer":1,"explanations":["La frecuencia absoluta es 12, pero el porcentaje se obtiene sobre 40.","¡Cachaste! Expresa como porcentaje: 30%.","40 es la cantidad total de encuestados.","70% corresponde a quienes no eligieron la mañana."],"steps":["Divide la frecuencia entre el total: 12÷40=0,30.","Expresa como porcentaje: 30%."],"easy":"Relativa significa qué parte del total representa un grupo.","example":"5 de 20 equivalen a 25%.","level":"intermedio","origin":"original"},{"id":251,"axis":"Probabilidad y estadística","skill":"Tablas y gráficos","topic":"Lectura de tabla","q":"Ventas de jugos: lunes 12, martes 15, miércoles 9 y jueves 14. ¿Cuántos jugos se vendieron en total?","options":["36","41","50","60"],"answer":2,"explanations":["Sumaste solo tres días.","Olvidaste considerar uno de los valores.","¡Cachaste! 12+15+9+14=50 jugos.","Revisa que los cuatro números sumen 50, no 60."],"steps":["Suma los registros de cada día.","12+15+9+14=50 jugos."],"easy":"Al leer una tabla, verifica qué representa cada cifra antes de operar.","example":"Si vendes 3 el lunes y 2 el martes, el total es 5.","level":"intermedio","origin":"original"},{"id":252,"axis":"Probabilidad y estadística","skill":"Tablas y gráficos","topic":"Comparación de datos","q":"Inscritos a talleres: fútbol 18, música 12, dibujo 9 y teatro 6. ¿Cuántas personas más eligieron fútbol que teatro?","options":["6","9","12","24"],"answer":2,"explanations":["6 son los inscritos a teatro, no la diferencia.","Restar 18−9 compara fútbol con dibujo.","¡Cachaste! Calcula diferencia: 18−6=12.","Sumar 18+6 no responde cuántos más."],"steps":["Identifica las categorías solicitadas: fútbol 18, teatro 6.","Calcula diferencia: 18−6=12."],"easy":"Cuántos más se responde restando, no sumando.","example":"Entre 10 y 4 hay 6 de diferencia.","level":"intermedio","origin":"original"},{"id":253,"axis":"Probabilidad y estadística","skill":"Tablas y gráficos","topic":"Promedio ponderado","q":"Una estudiante obtuvo 5,0 en una prueba que vale el 40% y 6,0 en otra que vale el 60%. ¿Cuál es su promedio ponderado?","options":["5,4","5,5","5,6","6,0"],"answer":2,"explanations":["Aplicaste los pesos al revés.","El promedio simple 5,5 no considera los pesos diferentes.","¡Cachaste! Suma 2,0+3,6=5,6.","Solo tomaste la segunda nota."],"steps":["Multiplica cada nota por su peso: 5,0×0,40=2,0; 6,0×0,60=3,6.","Suma 2,0+3,6=5,6."],"easy":"Si una prueba pesa más, influye más en el promedio.","example":"3 con peso 25% y 7 con 75% dan 6.","level":"intermedio","origin":"original"},{"id":254,"axis":"Probabilidad y estadística","skill":"Cuartiles","topic":"Datos ordenados","q":"Los datos ordenados son 2, 4, 6, 8, 10, 12 y 14. ¿Cuál es la mediana?","options":["6","7","8","10"],"answer":2,"explanations":["La posición central es la cuarta, no la tercera.","7 no aparece como valor central en siete datos.","¡Cachaste! El cuarto dato es 8.","El quinto dato ya está después de la mediana."],"steps":["Hay siete datos, por tanto el central está en la posición (7+1)÷2=4.","El cuarto dato es 8."],"easy":"Con un número impar de valores, el del medio es la mediana.","example":"En 1,3,5, la mediana es 3.","level":"intermedio","origin":"original"},{"id":255,"axis":"Probabilidad y estadística","skill":"Cuartiles","topic":"Primer cuartil","q":"Con los datos ordenados 2, 4, 6, 8, 10, 12 y 14, considera Q1 como la mediana de la mitad inferior excluyendo la mediana general. ¿Cuál es Q1?","options":["2","4","6","8"],"answer":1,"explanations":["El primer cuartil es el centro de la mitad inferior, no el mínimo.","¡Cachaste! La mediana de esa mitad es 4, entonces Q1=4.","La mitad inferior es 2,4,6: el centro no es 6.","8 es la mediana general, no el primer cuartil."],"steps":["Mitad inferior (sin incluir la mediana general): 2, 4, 6.","La mediana de esa mitad es 4, entonces Q1=4."],"easy":"Divide los datos en dos mitades alrededor de la mediana y encuentra el centro de la inferior.","example":"En 1,2,3,4,5, Q1 es 1,5 según el método de mitades excluyendo la mediana.","level":"intermedio","origin":"original"},{"id":256,"axis":"Probabilidad y estadística","skill":"Cuartiles","topic":"Percentil conceptual","q":"En un grupo ordenado, ¿qué indica que una puntuación está en el percentil 75?","options":["Supera aproximadamente al 25% del grupo","Es exactamente 75 puntos","Deja aproximadamente al 75% de los datos en o bajo ese valor","Es necesariamente el máximo del grupo"],"answer":2,"explanations":["La interpretación está al revés: deja aproximadamente al 75% en o bajo.","El percentil expresa posición, no una nota fija de 75.","¡Cachaste! P75 deja aproximadamente al 75% de observaciones en o bajo su valor.","Solo el percentil máximo se acerca al máximo."],"steps":["Un percentil indica la posición relativa dentro de una distribución.","P75 deja aproximadamente al 75% de observaciones en o bajo su valor."],"easy":"Percentil 75 no significa 75 puntos; significa estar cerca del límite superior del 75% de los datos.","example":"P50 coincide habitualmente con la mediana.","level":"intermedio","origin":"original"},{"id":257,"axis":"Probabilidad y estadística","skill":"Cuartiles","topic":"Diagrama de caja","q":"En un diagrama de caja, el extremo izquierdo de la caja es Q1 y el derecho es Q3. Si Q1=10 y Q3=18, ¿cuál es el rango intercuartílico?","options":["4","8","10","28"],"answer":1,"explanations":["Resta Q3−Q1, no la mitad de esa diferencia.","¡Cachaste! 18−10=8.","10 corresponde a Q1.","Sumaste Q1 y Q3 en lugar de restar."],"steps":["Rango intercuartílico = Q3−Q1.","18−10=8."],"easy":"Mide el ancho de la caja, entre el primer y el tercer cuartil.","example":"Q1=3, Q3=9 implican rango intercuartílico 6.","level":"intermedio","origin":"original"},{"id":258,"axis":"Probabilidad y estadística","skill":"Probabilidad","topic":"Evento complementario","q":"La probabilidad de lluvia es 0,35. ¿Cuál es la probabilidad de que NO llueva?","options":["0,35","0,55","0,65","1,35"],"answer":2,"explanations":["La probabilidad complementaria completa el total de 1.","0,35+0,55=0,90, falta 0,10.","¡Cachaste! P(no lluvia)=1−0,35=0,65.","Una probabilidad no puede superar 1."],"steps":["Todo evento y su complemento suman 1.","P(no lluvia)=1−0,35=0,65."],"easy":"Si sabes la probabilidad de que algo pase, réstala de 1 para hallar que no pase.","example":"Si P(ganar)=0,2, P(no ganar)=0,8.","level":"intermedio","origin":"original"},{"id":259,"axis":"Probabilidad y estadística","skill":"Probabilidad","topic":"Suma sin intersección","q":"En una bolsa hay 5 bolitas verdes, 3 amarillas y 2 rojas. ¿Cuál es la probabilidad de sacar una verde O una roja?","options":["1/2","7/10","3/10","8/10"],"answer":1,"explanations":["Hay cinco verdes, pero también dos rojas.","¡Cachaste! Total: 5+3+2=10; P=7/10.","Tres de diez son amarillas.","Debes sumar solo verdes y rojas, no amarillas."],"steps":["Casos favorables: 5 verdes+2 rojas=7.","Total: 5+3+2=10; P=7/10."],"easy":"Si los eventos no pueden ocurrir juntos en una extracción, sumas sus casos favorables.","example":"Con 2 azules y 3 rojas, la probabilidad de azul o rojo es 5/5.","level":"intermedio","origin":"original"},{"id":260,"axis":"Probabilidad y estadística","skill":"Probabilidad compuesta","topic":"Independencia","q":"Se lanza una moneda equilibrada dos veces. ¿Cuál es la probabilidad de obtener cara en ambos lanzamientos?","options":["1/2","1/3","1/4","3/4"],"answer":2,"explanations":["1/2 es la probabilidad de una cara en un solo lanzamiento.","Hay cuatro resultados equiprobables, no tres.","¡Cachaste! Como son independientes, multiplica: 1/2×1/2=1/4.","Tres de cuatro resultados no corresponden a dos caras."],"steps":["Cada lanzamiento tiene probabilidad 1/2 de cara.","Como son independientes, multiplica: 1/2×1/2=1/4."],"easy":"Para que ocurran dos eventos independientes se multiplican sus probabilidades.","example":"Tres caras seguidas tienen probabilidad 1/8.","level":"intermedio","origin":"original"},{"id":261,"axis":"Probabilidad y estadística","skill":"Probabilidad compuesta","topic":"Sin reposición","q":"Una caja contiene 3 fichas azules y 2 rojas. Se extraen dos sin devolver la primera. ¿Qué probabilidad hay de que ambas sean rojas?","options":["1/10","2/5","1/5","4/25"],"answer":0,"explanations":["¡Cachaste! Multiplica 2/5×1/4=2/20=1/10.","La segunda extracción ya no tiene 5 fichas.","No se puede mantener 2 rojas disponibles después de extraer una.","Es incorrecto usar 2/5 en ambas extracciones porque no hay reposición."],"steps":["Probabilidad de roja primero: 2/5.","Queda 1 roja entre 4 fichas: 1/4.","Multiplica 2/5×1/4=2/20=1/10."],"easy":"Sin devolución cambia la cantidad de fichas disponibles.","example":"De 2 rojas entre 3, sacar dos rojas sin reposición tiene probabilidad 2/3×1/2=1/3.","level":"intermedio","origin":"original"},{"id":262,"axis":"Probabilidad y estadística","skill":"Probabilidad compuesta","topic":"Regla aditiva con intersección","q":"Al lanzar un dado, ¿cuál es la probabilidad de obtener un número par O mayor que 4?","options":["1/3","1/2","2/3","5/6"],"answer":2,"explanations":["Solo estás considerando dos de los casos favorables.","Hay otro caso que cumple: el 5.","¡Cachaste! Son 4 de 6: 4/6=2/3.","Incluiste un resultado que no es par ni mayor que 4."],"steps":["Pares: {2,4,6}. Mayores que 4: {5,6}.","Unión sin repetir el 6: {2,4,5,6}.","Son 4 de 6: 4/6=2/3."],"easy":"Si un resultado aparece en ambos eventos, cuéntalo una sola vez.","example":"En un dado, par o 6 sigue siendo tres casos: {2,4,6}.","level":"intermedio","origin":"original"},{"id":263,"axis":"Probabilidad y estadística","skill":"Probabilidad","topic":"Eventos incompatibles","q":"Al lanzar un dado común una vez, ¿cuál es la probabili function chooseExam(count){const quotas=count===65?{'Números':16,'Álgebra y funciones':19,'Geometría':15,'Probabilidad y estadística':15}:{'Números':3,'Álgebra y funciones':3,'Geometría':2,'Probabilidad y estadística':2};let selection=[];for(const [axis,quota]of Object.entries(quotas)){const pool=catalog.filter(q=>axisOf(q)===axis).map(q=>({q,seen:history.filter(h=>h.id===q.id).length,tie:Math.random()}));const used={};for(let j=0;j<quota&&pool.length;j++){pool.sort((a,b)=>(a.seen*4+(used[a.q.skill]||0))-(b.seen*4+(used[b.q.skill]||0))||a.tie-b.tie);const pick=pool.shift();selection.push(pick.q);used[pick.q.skill]=(used[pick.q.skill]||0)+1}}if(selection.length<count){const seen=new Set(selection.map(q=>q.id));const remainder=catalog.filter(q=>!seen.has(q.id)).map(q=>({q,seen:history.filter(h=>h.id===q.id).length,tie:Math.random()})).sort((a,b)=>a.seen-b.seen||a.tie-b.tie);selection.push(...remainder.slice(0,count-selection.length).map(x=>x.q))}for(let n=selection.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[selection[n],selection[j]]=[selection[j],selection[n]]}if(count===65)selection.sort((a,b)=>difficultyOrder(a)-difficultyOrder(b));return selection.slice(0,count)}

let options=q.options.map((o,j)=>'<button class="option '+(choice===j?'selected':'')+'" aria-pressed="'+(choice===j)+'" onclick="choice='+j+';examAnswers[i]='+j+';persistExam();draw()">'+String.fromCharCode(65+j)+') '+o+'</button>').join('');
const done=examAnswers.filter(v=>v!==null).length;
return '<div class="row"><button class="btn secondary" onclick="navigate(&quot;home&quot;)">← Salir</button><b>Simulacro '+(i+1)+' / '+queue.length+'</b></div>'+(examDeadline?'<p class="exam-clock" id="exam-timer" role="timer" aria-label="Tiempo restante">Tiempo restante: '+formatExamTime()+'</p>':'')+'<div class="bar"><div style="width:'+(done/queue.length*100)+'%"></div></div><p class="small">'+done+' de '+queue.length+' respondidas</p><div class="card"><span class="eyebrow">MODO ENSAYO · SIN PISTAS</span><h2 style="margin-top:16px">'+q.q+'</h2><div class="stack">'+options+'</div><p class="small">Puedes dejar preguntas sin responder. La corrección aparece al finalizar.</p><div class="actions">'+(i?'<button class="btn secondary" onclick="examMove(-1)">← Anterior</button>':'')+'<button class="btn" onclick="examMove(1)">'+(i===queue.length-1?(queue.length===65?'Revisar y finalizar':'Finalizar simulacro'):'Siguiente →')+'</button></div>'+(queue.length===65?'<div class="exam-extra"><button class="btn secondary" onclick="toggleExamFlag()">'+(examFlags.includes(q.id)?'✓ Marcada para revisar':'Marcar para revisar')+'</button><button class="btn secondary" onclick="toggleExamOverview()">'+(examOverviewOpen?'Ocultar mapa':'Ver mapa de preguntas')+'</button></div>':'')+'</div>'+examOverview();
}
function formatExamTime(){const seconds=Math.max(0,Math.ceil((examDeadline-Date.now())/1000));return Math.floor(seconds/3600)+':'+String(Math.floor((seconds%3600)/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function finishExam(){if(!exam)return;round=queue.map((q,n)=>({id:q.id,skill:q.skill,correct:examAnswers[n]===q.answer&&examAnswers[n]!==null,unanswered:examAnswers[n]===null,confidence:'sin-declarar',date:new Date().toISOString()}));history.push(...round);save();exam=false;clearExam();navigate('result')}
function examMove(step){if(examDeadline&&Date.now()>=examDeadline){finishExam();return}if(step===1&&i===queue.length-1){if(queue.length===65){examConfirming=true;examOverviewOpen=false;draw();return}finishExam();return}i=Math.max(0,Math.min(queue.length-1,i+step));choice=examAnswers[i];persistExam();draw();window.scrollTo(0,0)}
if(typeof setInterval==='function'){setInterval(()=>{if(!exam||!examDeadline||page!=='quiz')return;if(Date.now()>=examDeadline){finishExam();return}const timer=document.getElementById('exam-timer');if(timer)timer.textContent='Tiempo restante: '+formatExamTime()},1000)}
function check(){if(choice===null||checked)return;const q=queue[i];const response={id:q.id,skill:q.skill,correct:choice===q.answer,confidence,date:new Date().toISOString()};history.push(response);round.push(response);checked=true;save();draw()}function next(){if(i+1===queue.length){page='result'}else{i++;choice=null;checked=false;confidence='duda';mode='steps'}draw();window.scrollTo(0,0)}function resultAxes(){if(round.length<10)return '';const axes=['Números','Álgebra y funciones','Geometría','Probabilidad y estadística'];return '<div class="card"><h2>Tu desempeño por eje</h2><p class="small">Este porcentaje corresponde únicamente a este simulacro; no es una conversión a puntaje PAES.</p>'+axes.map(axis=>{const attempts=round.filter(h=>{const q=catalog.find(q=>q.id===h.id);return q&&axisOf(q)===axis});if(!attempts.length)return '';const wins=attempts.filter(h=>h.correct).length;return '<div style="margin:14px 0"><b>'+axis+'</b><p class="small">'+wins+' de '+attempts.length+' respuestas correctas</p><div class="bar"><div style="width:'+(wins/attempts.length*100)+'%"></div></div></div>'}).join('')+'</div>'}
function result(){let wins=round.filter(h=>h.correct).length;const missed=round.filter(h=>!h.correct);return '<span class="eyebrow">RONDA TERMINADA</span><h1>¡Bien por darte el tiempo!</h1><div class="card"><h2>'+wins+' de '+queue.length+' correctas</h2><p>No importa solo cuántas acertaste: importa que hayas entendido el camino.</p>'+resultAxes()+(missed.length?'<p><b>Temas por repasar:</b> '+[...new Set(missed.map(h=>h.skill))].join(', ')+'</p><p><button class="btn secondary" onclick="reviewErrors()">Revisar mis errores ('+Math.min(missed.length,10)+(missed.length>10?' primeros':'')+')</button></p>':'<p>¡Bien! No registraste errores.</p>')+(missed.length&&availableTransferQuestions().length>0?'<p><button class="btn secondary" onclick="verifyLearning()">Comprobar si aprendí · preguntas nuevas</button></p>':'')+'<div class="actions"><button class="btn" onclick="start(\'repaso\')">Practicar lo que cuesta</button> <button class="btn secondary" onclick="navigate(\'progress\')">Ver progreso</button></div></div>'}function reviewErrors(){const wrong=round.filter(h=>!h.correct).map(h=>catalog.find(q=>q.id===h.id)).filter(Boolean);if(!wrong.length)return;exam=false;examDeadline=null;queue=wrong.slice(0,10);i=0;round=[];choice=null;checked=false;mode='steps';confidence='duda';navigate('quiz')}
function availableTransferQuestions(){const excluded=new Set(round.map(h=>h.id));const skills=[...new Set(round.filter(h=>!h.correct).map(h=>h.skill))];return skills.map(skill=>catalog.filter(v=>v.skill===skill&&!excluded.has(v.id)).sort((a,b)=>history.filter(h=>h.id===a.id).length-history.filter(h=>h.id===b.id).length)[0]).filter(Boolean)}
function verifyLearning(){const candidates=availableTransferQuestions();if(!candidates.length)return;exam=true;examDeadline=null;examFlags=[];examConfirming=false;examOverviewOpen=false;queue=candidates;i=0;round=[];examAnswers=Array(queue.length).fill(null);choice=null;checked=false;persistExam();navigate('quiz')}function skillInsights(){
 const all=[...new Set(catalog.map(q=>q.skill))];
 return all.map(skill=>{
   const items=history.filter(h=>h.skill===skill);
   const recent=items.slice(-5);
   const confident=recent.filter(h=>h.correct&&h.confidence==='seguro').length;
   const uncertain=recent.filter(h=>h.correct&&['duda','azar'].includes(h.confidence)).length;
   const essayCorrect=recent.filter(h=>h.correct&&h.confidence==='sin-declarar').length;
   const errors=recent.filter(h=>!h.correct).length;
   const level=recent.length>=2&&errors===0&&confident>=2?'En progreso sólido':errors>0?'Necesita refuerzo':uncertain>0?'Aún con dudas':essayCorrect>0?'Acierto en ensayo · falta confirmar dominio':'Por practicar';
   return {skill,level,count:items.length,confident,uncertain,essayCorrect,errors};
 });
}
function progress(){let unique=[...new Set(history.map(h=>h.skill))];return '<span class="eyebrow">TU PROGRESO</span><h1>Cada intento cuenta.</h1><div class="card"><h2>Tu mapa de aprendizaje</h2><p>Acertar por azar no significa dominar un tema. Aquí distinguimos aciertos seguros, dudas y errores.</p>'+skillInsights().map(x=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+x.skill+'</b><p class="small">'+x.level+' · '+x.confident+' aciertos seguros · '+x.uncertain+' con dudas · '+x.essayCorrect+' aciertos en ensayo · '+x.errors+' errores recientes</p></div>').join('')+'</div><div class="card"><h2>'+history.length+' respuestas registradas</h2><p>Guardamos el avance únicamente en este dispositivo.</p>'+(unique.length?unique.map(skill=>{let h=history.filter(x=>x.skill===skill),n=h.filter(x=>x.correct).length;return '<p><b>'+skill+'</b> · '+n+'/'+h.length+' aciertos</p><div class="bar"><div style="width:'+(100*n/h.length)+'%"></div></div>'}).join(''):'<p>Aún no hay resultados. Parte con una práctica.</p>')+'</div><div class="actions"><button class="btn" onclick="start(\'repaso\')">Repasar</button> <button class="btn secondary" onclick="navigate(\'home\')">Volver</button></div>'}function draw(){app.innerHTML=head()+(!storageAvailable?'<p class="storage-notice" role="status">Puedes seguir practicando, pero tu navegador no pudo guardar el progreso. El avance de esta sesión puede perderse al cerrar.</p>':'')+({home,quiz,result,progress}[page]||home)()+'<footer>Prototipo educativo · Preguntas de demostración, no material DEMRE · Sin cuentas ni predicción de puntaje.</footer>'}draw();
</script></body></html>
