name: ¿Cachaste? · Preview Pages Free por API
on:
  workflow_dispatch:
  push:
    branches: [work/cachaste-web-unificada-20261106]
    paths: [web/deploy-preview.request]
permissions:
  contents: read
  actions: read
concurrency:
  group: cachaste-pages-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref_name == 'work/cachaste-web-unificada-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      CLOUDFLARE_PAGES_PROJECT: cachaste-sitecacho
      # Account IDs are public identifiers, not credentials. This is the owner's confirmed account.
      CLOUDFLARE_ACCOUNT_ID: cfe4b77c0c39bb056306d16133a93642
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar solicitud de preview, rama y ausencia de pagos
        run: node web/scripts/verify-preview-request.mjs
      - name: Comprobar el token y la cuenta fija sin conectarse al panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs --check-credentials
      - name: Comprobar acceso real al proyecto fijo sin modificarlo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs --check-access
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar protección de Android, backend y pagos simulados
        run: |
          node web/scripts/verify-android.mjs
          node --test web/tests/*.test.mjs
      - name: Exigir QA completa del mismo commit antes de subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/verify-preview-qa.mjs
      - name: Crear o preparar únicamente cachaste-sitecacho y generar claves privadas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs
      - name: Verificar Fail closed, secretos y reserva de producción por API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/verify-pages-project.mjs
      - name: Construir distribución privada cifrada
        run: node web/scripts/build.mjs
      - name: Verificar cifrado de todas las materias antes de subir
        run: node web/scripts/verify-private-distribution.mjs
      - name: Subir únicamente preview pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Run from the repository root: the API settings prepared above are authoritative.
        run: npx --yes wrangler@4.45.0 pages deploy web/dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Comprobar HTTPS, versión, bloqueo Premium y cobros cerrados en la URL real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/verify-pages-preview.mjs
      - name: Vincular exclusivamente sitecacho.cl a la rama verificada, con cobros cerrados
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/configure-sitecacho-domain.mjs
      - name: Verificar navegadores preinstalados de la misma versión
        run: node -e "const fs=require('node:fs');const {chromium,webkit}=require('@playwright/test');for(const b of [chromium,webkit])if(!fs.existsSync(b.executablePath()))throw Error('MATCHING_BROWSER_REQUIRED')"
      - name: Comprobar páginas legales desplegadas en Android, iPhone y escritorio sin sesión
        run: node web/scripts/probe-legal-browsers.mjs
      - name: Verificar Supabase alojado y distinguir la cobertura de navegador disponible
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            node web/scripts/test-hosted-preview.mjs
          else
            node web/scripts/verify-live-billing-evidence.mjs
          fi
      - name: Conservar URL y evidencia sin secretos ni bancos
        # Public legal resources are also exercised in actual mobile browser engines.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Pages-Preview
          path: |
            web/artifacts/pages-preview.json
            web/artifacts/domain-live.json
            web/artifacts/legal-live/
            web/artifacts/hosted-live/
          if-no-files-found: ignore
          retention-days: 14
