name: ¿Cachaste? · Preview Pages Free por API
on:
  workflow_dispatch:
  push:
    branches: [work/cachaste-web-comercial-20261024]
    paths: [web/deploy-preview.request]
permissions:
  contents: read
  actions: read
concurrency:
  group: cachaste-pages-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref_name == 'work/cachaste-web-comercial-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_PAGES_PROJECT: cachaste-sitecacho
      # Account IDs are public identifiers, not credentials. This is the owner's confirmed account.
      CLOUDFLARE_ACCOUNT_ID: cfe4b77c0c39bb056306d16133a93642
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar el token y la cuenta fija sin conectarse al panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs --check-credentials
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar protección de Android, backend y pagos simulados
        run: |
          node web/scripts/verify-android.mjs
          node --test web/tests/*.test.mjs
      - name: Exigir QA completa del mismo commit antes de subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/verify-preview-qa.mjs
      - name: Crear o preparar únicamente cachaste-sitecacho y generar claves privadas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs
      - name: Verificar Fail closed, secretos y reserva de producción por API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/verify-pages-project.mjs
      - name: Construir distribución privada cifrada
        run: node web/scripts/build.mjs
      - name: Verificar cifrado de todas las materias antes de subir
        run: node web/scripts/verify-private-distribution.mjs
      - name: Subir únicamente preview pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Run from the repository root: the API settings prepared above are authoritative.
        run: npx --yes wrangler@4.45.0 pages deploy web/dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=work/cachaste-web-comercial-20261024 --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Comprobar HTTPS, versión, bloqueo Premium y cobros cerrados en la URL real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/verify-pages-preview.mjs
      - name: Conservar URL y evidencia sin secretos ni bancos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Pages-Preview
          path: web/artifacts/pages-preview.json
          if-no-files-found: ignore
          retention-days: 14
