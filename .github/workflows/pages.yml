name: Pages · pruebas móviles y despliegue

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'reports/**']
  pull_request:
    branches: [main, work/quests-progress-ui-20261015]
    paths-ignore: ['README.md', 'docs/**', 'reports/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pruebas Android, iPhone y 320 px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      - run: npm run audit:pedagogy
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Conservar reporte móvil un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tests-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          if-no-files-found: ignore
      - name: Preparar publicación
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Leer configuración Pages (habilitación inicial requiere administración)
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Comprobar enlace público en móviles
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/wait-for-site.mjs
      - run: npm test
      - name: Conservar verificación pública un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-tests-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          if-no-files-found: ignore
