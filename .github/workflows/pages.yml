name: Pages · pruebas móviles y despliegue

on:
  push:
    branches: [main, work/cachaste-motor-duolingo-20261016]
    paths-ignore: ['README.md', 'docs/**', 'reports/**', '.github/workflows/qa-delivery.yml', 'qa-delivery-request.json', 'scripts/competition-backup.mjs', 'scripts/competition-restore.mjs', '.github/workflows/competition-backup-restore.yml', '.github/workflows/android-apk.yml', '.github/workflows/pages.yml']
  pull_request:
    branches: [main, work/quests-progress-ui-20261015]
    paths-ignore: ['README.md', 'docs/**', 'reports/**', '.github/workflows/qa-delivery.yml', 'qa-delivery-request.json', 'scripts/competition-backup.mjs', 'scripts/competition-restore.mjs', '.github/workflows/competition-backup-restore.yml', '.github/workflows/android-apk.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pruebas · ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Android-Chrome
            browser: chromium
          - project: iPhone-WebKit
            browser: webkit
          - project: mobile-320px
            browser: chromium
    runs-on: ubuntu-latest
    # Independent device jobs preserve all checks while shortening feedback.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      - run: npm run audit:pedagogy
      - run: npm run build
      - name: Preparar Chromium con descarga acotada
        if: matrix.browser == 'chromium'
        run: bash scripts/install-chromium-qa.sh
      - name: Preparar WebKit
        if: matrix.browser == 'webkit'
        run: npx playwright install --with-deps webkit
      - run: npm test -- --project="${{ matrix.project }}"
      - name: Conservar reporte móvil un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tests-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          if-no-files-found: ignore
      - name: Preparar publicación
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.project == 'Android-Chrome'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Leer configuración Pages (habilitación inicial requiere administración)
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: Comprobar enlace público en móviles
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/wait-for-site.mjs
      - run: npm test
      - name: Conservar verificación pública un día
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-tests-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          if-no-files-found: ignore
