name: Mercado Pago sandbox regression
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/mercadopago-*.mjs'
      - 'web/tests/mercadopago-sandbox.test.mjs'
      - 'web/tests/sandbox-db.test.mjs'
      - '.github/workflows/mp-sandbox-signature-tests.yml'
  push:
    branches:
      - 'work/cachaste-mp-signature-diagnostics-20261112'
jobs:
  sandbox-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sandbox webhook regression tests
        run: node --test web/tests/mercadopago-sandbox.test.mjs web/tests/sandbox-db.test.mjs
