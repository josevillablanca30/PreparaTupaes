name: Android APK · compilación de prueba
on:
  push:
    branches: [main]
    paths: ['index.html', 'inicio.html', 'science.html', 'science-bank.js', 'science-app.js', 'reading.html', 'reading-bank.js', 'reading-app.js', 'android/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/android-apk.yml']
  workflow_dispatch:
concurrency:
  group: cachaste-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar lógica y clave editorial antes del APK
        run: npm run test:logic
      - name: Construir aplicación web empaquetada
        run: npm run build
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Validar uso táctil Android y pantalla de 320 px
        run: npm test -- --project=Android-Chrome --project=mobile-320px
      - name: Guardar capturas de errores móviles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cachaste-qa-movil-fallido
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Empaquetar la versión web local para Android
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html
          cp dist/inicio.html dist/science.html dist/science-bank.js dist/science-app.js dist/reading.html dist/reading-bank.js dist/reading-app.js android/app/src/main/assets/
      - name: Compilar APK de prueba
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Unificado-Beta-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
