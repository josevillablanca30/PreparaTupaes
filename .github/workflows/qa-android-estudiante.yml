name: Recorrido web y Android 51 con cuenta normal
on:
  workflow_dispatch:
  push:
    branches: [qa/android-51-estudiante]
    paths: [.github/workflows/qa-android-estudiante.yml]
permissions:
  contents: read
jobs:
  estudiante:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preparar contraseña aleatoria de QA
        run: |
          umask 077
          openssl rand -hex 32 | tr -d '\n' > "$RUNNER_TEMP/student-test-password"
          cat > "$RUNNER_TEMP/public.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAoQOvPBMpVjr5bY/J/Uly
          xqHTr5RrgI/Fx9OJgbg+4GU8aF1MtTTSDmbZxikQ8YIvyUtCTPGqfIFRnv1Zll02
          aMoJ0RJvZezcfPHz8nE1hqZ1mMj+8jHFCmiUbdzUjRaTm3pWpIIzNDcp2SA2Va2D
          Yqh4nT21HwTEQJT3WquADedIJ3jSK0X7vCUySpDWkeU1ZBCIDhTeR8aJtfCYYeh8
          ndjQE0BNxX6j+eLxI4Md8OkfGXf8KhNgWIVI1M72W62thm9BEAoZ8VMmbHoR9JYK
          +qQ3zOHmXpMVneYP82kxDbuRaHIusIyVkKxIt2Us8zMVXAlqUG2BzW1qyjy4bXPa
          5wtTRxoASpbyokvQKLaFFk0ADYTKCACuTGvilSCIe4Z/F6g2U00H4xCG2Ticlaoy
          xPtj1MYW9Yo1EZ8lOf5kYDWuQDMb9ws9+4oT254jQ648LXckbTsuTzpQKVLSXCoH
          dcFz9sNKjlpWeCRgOe5A1okHEem6o68/vH8mn9buNkf3AgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/student-test-password" -out "$RUNNER_TEMP/credencial-cifrada.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: Credencial-QA-cifrada
          path: ${{ runner.temp }}/credencial-cifrada.bin
          retention-days: 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && node scripts/build.mjs && node scripts/build-android-access.mjs
      - run: npx playwright install --with-deps chromium
      - name: Recorrido web publicado con cuenta Básica
        continue-on-error: true
        id: web
        run: node qa-estudiante-web.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar dispositivo y APK de prueba
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest -PcachasteCommercialAccessQa
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Registro, lección y reingreso en instalación limpia
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-linux-hw-accel: false
          arch: x86_64
          disable-animations: true
          script: bash qa-android-journey.sh
      - if: always() && steps.web.outcome != 'success'
        run: exit 1
      - if: always()
        run: rm -f "$RUNNER_TEMP/student-test-password"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidencia-Android-51-${{ github.run_id }}
          path: evidencia/*.png
          if-no-files-found: ignore
          retention-days: 7
