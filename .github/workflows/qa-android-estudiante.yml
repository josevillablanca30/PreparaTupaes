name: Recorrido Android 51 con cuenta normal
on:
  workflow_dispatch:
  push:
    branches: [qa/android-51-estudiante]
    paths: [.github/workflows/qa-android-estudiante.yml]
permissions:
  contents: read
jobs:
  estudiante:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preparar credencial del estudiante de QA
        env:
          QA_LOGIN: ${{ secrets.CACHASTE_QA_STUDENT_PASSWORD }}
        run: |
          test -n "$QA_LOGIN" || { echo 'Falta la contraseña de la cuenta de prueba confirmada'; exit 1; }
          umask 077
          printf %s "$QA_LOGIN" > "$RUNNER_TEMP/student-test-password"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && node scripts/build.mjs && node scripts/build-android-access.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar dispositivo y APK de prueba
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest -PcachasteCommercialAccessQa
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Registro, lección y reingreso en instalación limpia
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          disable-linux-hw-accel: false
          arch: x86_64
          disable-animations: true
          script: bash qa-android-journey.sh
      - if: always()
        run: rm -f "$RUNNER_TEMP/student-test-password"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidencia-Android-51-${{ github.run_id }}
          path: evidencia/*.png
          if-no-files-found: ignore
          retention-days: 7
