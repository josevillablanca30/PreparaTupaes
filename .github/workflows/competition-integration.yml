name: Competencia · Auth real y transacciones
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [work/cachaste-motor-duolingo-20261016]
    paths: ['supabase/**','competition-*','scripts/competition-*','scripts/test-competition-online.mjs','tests/competition*','tests/helpers/competition*','.github/workflows/competition-integration.yml','package*.json','.github/workflows/android-play.yml']
permissions:
  contents: read
concurrency:
  group: competition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probar RLS, resultados, empates, tiempos y estrellas en Postgres
        run: node --test tests/competition-security.test.mjs tests/competition-community.test.mjs tests/competition-closed-test.test.mjs
      - name: Regenerar catálogo privado sin identidades ni suscripciones
        run: node scripts/competition-catalog.mjs supabase/seed.sql
      - name: Arrancar Supabase efímero local
        run: npx --yes supabase@2.121.0 start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/cachaste-supabase-start.log 2>&1
      - name: Probar dos cuentas por Auth y PostgREST reales
        run: |
          npx --yes supabase@2.121.0 status -o json > /tmp/cachaste-supabase-status.json
          chmod 600 /tmp/cachaste-supabase-status.json
          node scripts/test-competition-online.mjs /tmp/cachaste-supabase-status.json
      - name: Resumir resultado de integración sin exponer credenciales
        if: always()
        run: |
          if [ -s reports/competition-online-integration.json ]; then
            node -e "const r=require('./reports/competition-online-integration.json'); const lines=['## Integración de duelos (Supabase local)','- Pruebas aprobadas: '+r.passed,'- Pruebas fallidas: '+r.failed,'- Alcance: '+r.scope]; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n')"
          else
            printf '%s\n' '## Integración de duelos' 'La prueba HTTP no generó su informe. Revisar el primer paso fallido (instalación, arranque local o ejecución). No se certifica multijugador.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cachaste-competition-integration-${{ github.run_id }}
          path: reports/competition-online-integration.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Destruir identidades y contenedores de prueba
        if: always()
        run: |
          npx --yes supabase@2.121.0 stop --no-backup
          rm -f /tmp/cachaste-supabase-status.json /tmp/cachaste-supabase-start.log
