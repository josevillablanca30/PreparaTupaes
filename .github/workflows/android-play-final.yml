name: Cachaste final signed AAB - no Play publication
on:
  workflow_dispatch:
  push:
    branches: [work/cachaste-cierre-android-20261120]
    paths: ['android/app/build.gradle', 'learning/**', 'android/app/src/main/java/**', 'web/scripts/verify-android.mjs', '.github/workflows/android-play-final.yml', 'scripts/VerifyPlayBundle.java', 'scripts/verify-play-manifest.py', 'scripts/prepare-android-upgrade-qa.sh', 'scripts/run-android-upgrade-qa.sh', 'android/app/src/commercialAccessQa/java/cl/preparatupaes/app/UpgradePersistenceTest.java']
permissions:
  contents: read
  actions: read
concurrency:
  group: cachaste-final-signed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar secretos sin imprimir valores
        env:
          CACHASTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.CACHASTE_RELEASE_KEYSTORE_BASE64 }}
          CACHASTE_RELEASE_STORE_PASSWORD: ${{ secrets.CACHASTE_RELEASE_STORE_PASSWORD }}
          CACHASTE_RELEASE_KEY_ALIAS: ${{ secrets.CACHASTE_RELEASE_KEY_ALIAS }}
          CACHASTE_RELEASE_KEY_PASSWORD: ${{ secrets.CACHASTE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CACHASTE_RELEASE_KEYSTORE_BASE64 CACHASTE_RELEASE_STORE_PASSWORD CACHASTE_RELEASE_KEY_ALIAS CACHASTE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name. No se generará ningún AAB."
              missing=1
            fi
          done
          test "$missing" = 0
  verified-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse approved educational, web and installed upgrade checks for the same application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const verified='94be8f2aea800af8dab703d2f0fa8ecd3c0cc8f9',run=44790766013;
          const changes=execFileSync('git',['diff','--name-only',verified,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const metadata=new Set(['.github/workflows/android-play-final.yml','android/app/build.gradle','scripts/verify-play-manifest.py','docs/cachaste-cierre-20261120.md','reports/cachaste-original-install-20261120.json','reports/cachaste-final-aab-20261120.json','web/supabase/verify-original-install.sql']);
          assert.ok(changes.every(file=>metadata.has(file)),'Educational source changed: execute new full QA before updating the verified source');
          const fileAt=(ref,path)=>execFileSync('git',['show',ref+':'+path],{encoding:'utf8'});
          assert.equal(fileAt('HEAD','android/app/build.gradle'),fileAt(verified,'android/app/build.gradle').replace(/^([ \t]*)versionCode 48$/m,'$1versionCode 49'),'Gradle changes must be limited to versionCode 49');
          assert.equal(fileAt('HEAD','scripts/verify-play-manifest.py'),fileAt(verified,'scripts/verify-play-manifest.py').replace("'versionCode': '48'","'versionCode': '49'"),'Manifest verifier changes must be limited to versionCode 49');
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          assert.ok(response.ok,'Cannot verify previous Actions jobs');const {jobs}=await response.json();
          for(const name of ['signing-preflight','integration / integration','web-regression / commercial-smoke'])assert.ok(jobs.some(job=>job.name===name&&job.conclusion==='success'),'Missing approved job: '+name);
          console.log(JSON.stringify({verifiedSource:verified,verifiedRun:run,identicalEducationalSource:true,approvedJobs:3}));
          JS
  signed-bundle:
    needs: [signing-preflight, verified-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_UPLOAD_SHA256: a566926f01e79e5f75422b5c03c91b4337018e4f7987b32888c650ca7f271575
      CACHASTE_PLAY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - run: node scripts/build-android-access.mjs
      - name: Empaquetar distribución pública sin VS local ni fixtures
        run: |
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Preparar SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Preparar bundletool oficial con hash fijo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Compilar release con clave permanente y verificar todas las entradas firmadas
        env:
          CACHASTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.CACHASTE_RELEASE_KEYSTORE_BASE64 }}
          CACHASTE_RELEASE_KEYSTORE: ${{ runner.temp }}/cachaste-upload.jks
          CACHASTE_RELEASE_STORE_PASSWORD: ${{ secrets.CACHASTE_RELEASE_STORE_PASSWORD }}
          CACHASTE_RELEASE_KEY_ALIAS: ${{ secrets.CACHASTE_RELEASE_KEY_ALIAS }}
          CACHASTE_RELEASE_KEY_PASSWORD: ${{ secrets.CACHASTE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$CACHASTE_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$CACHASTE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CACHASTE_RELEASE_KEYSTORE"
          unset CACHASTE_RELEASE_KEYSTORE_BASE64
          mkdir -p play-delivery
          keytool -exportcert -rfc -keystore "$CACHASTE_RELEASE_KEYSTORE" -storepass:env CACHASTE_RELEASE_STORE_PASSWORD -alias "$CACHASTE_RELEASE_KEY_ALIAS" > play-delivery/upload-certificate.pem
          actual=$(openssl x509 -in play-delivery/upload-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          test "$actual" = "$EXPECTED_UPLOAD_SHA256" || { echo '::error::La clave no coincide con el certificado de carga fijado y confirmado por el titular.'; exit 1; }
          gradle -p android --no-daemon :app:lintRelease :app:bundleRelease
          cp android/app/build/outputs/bundle/release/app-release.aab play-delivery/Cachaste-1.5.0-rc21-49.aab
          java scripts/VerifyPlayBundle.java play-delivery/Cachaste-1.5.0-rc21-49.aab "$EXPECTED_UPLOAD_SHA256" > play-delivery/verification.json
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=play-delivery/Cachaste-1.5.0-rc21-49.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=play-delivery/Cachaste-1.5.0-rc21-49.aab --module=base > play-delivery/AndroidManifest.xml
          python3 scripts/verify-play-manifest.py play-delivery/AndroidManifest.xml > play-delivery/manifest-verification.json
          printf '%s\n' "$GITHUB_SHA" > play-delivery/source-commit.txt
          sha256sum play-delivery/*.aab > play-delivery/SHA256SUMS.txt
      - name: Eliminar clave temporal incluso tras errores
        if: always()
        run: rm -f "$RUNNER_TEMP/cachaste-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Play-SIGNED-49-${{ github.sha }}
          path: play-delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
