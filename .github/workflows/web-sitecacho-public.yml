name: ¿Cachaste? · Web pública con cobros cerrados
on:
  workflow_dispatch:
  push:
    branches: [work/cachaste-web-comercial-cierre-20261112]
    paths: [web/deploy-public.request]
permissions:
  contents: read
  actions: read
concurrency:
  group: cachaste-pages-preview
  cancel-in-progress: false
jobs:
  public-site:
    if: github.ref_name == 'work/cachaste-web-comercial-cierre-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      CLOUDFLARE_ACCOUNT_ID: cfe4b77c0c39bb056306d16133a93642
      CLOUDFLARE_PAGES_PROJECT: cachaste-sitecacho
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar el checkout de la rama autorizada
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalizar la credencial existente sin publicarla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/prepare-pages-project.mjs --check-credentials
      - name: Exigir QA del mismo commit y preparar solo el runtime público con pagos cerrados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/publish-sitecacho.mjs --prepare
      - name: Limpiar halo blanco del PNG original de la mascota
        run: |
          python3 -m pip install --break-system-packages Pillow==11.3.0
          python3 web/scripts/cutout-landing-cat.py
      - name: Construir y verificar las cinco materias cifradas
        run: |
          node web/scripts/build.mjs
          node web/scripts/verify-private-distribution.mjs
      - name: Publicar la web solicitada sin activar Mercado Pago
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.45.0 pages deploy web/dist --project-name=cachaste-sitecacho --branch=production-requires-owner-approval --commit-hash="$GITHUB_SHA" --commit-dirty=false
      - name: Validar los dos dominios por Pages sin modificar DNS ni Resend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/publish-sitecacho.mjs --domains
      - name: Comprobar la revisión pública, archivos privados y pagos cerrados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/publish-sitecacho.mjs --verify
      - name: Verificar la web pública en cuatro navegadores
        run: node web/scripts/probe-legal-browsers.mjs --public
      - name: Verificar nuevamente que los pagos reales siguen cerrados
        run: node --input-type=module -e "import {requirePaymentsClosed} from './web/scripts/publish-sitecacho.mjs'; await requirePaymentsClosed(); console.log('Production payments remain closed')"
      - name: Guardar resultados y capturas sin secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Sitecacho-Public
          path: |
            web/artifacts/pages-public.json
            web/artifacts/public-domains.json
            web/artifacts/legal-live/
            web/artifacts/hosted-live/
          if-no-files-found: ignore
          retention-days: 14
