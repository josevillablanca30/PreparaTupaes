name: ¿Cachaste? Web · seguridad, cinco materias y navegadores
on:
  push:
    branches: [work/cachaste-web-comercial-20261024]
    paths: ['web/**','supabase/functions/_shared/mercadopago-*','supabase/functions/cachaste-mercadopago/**','supabase/functions/cachaste-mp-events/**','.github/workflows/web-commercial.yml','.github/workflows/web-pages-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cachaste-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Proteger candidata Android y regresión educativa original
        run: |
          node web/scripts/verify-android.mjs
          npm run test:logic
      - name: Backend web, pagos simulados y compatibilidad competitiva
        run: node --test web/tests/*.test.mjs
      - name: Validar sintaxis y descubrir recorridos antes de instalar navegadores
        run: npx playwright test --config=web/playwright.config.mjs --list
      - name: Construir las cinco materias y cifrar contenido Pages
        run: node web/scripts/build.mjs
      - name: Verificar integridad del cifrado y ausencia de bancos públicos
        run: node web/scripts/verify-private-distribution.mjs --local
      - uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Web-Pages-${{ github.sha }}
          path: web/dist/
          retention-days: 14
  browsers:
    needs: core
    name: Navegador · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser: [Android-Chrome, iPhone-WebKit, Desktop-Chrome, mobile-320px]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node web/scripts/build.mjs
      - name: Preparar Chrome
        if: matrix.browser != 'iPhone-WebKit'
        run: bash scripts/install-chromium-qa.sh
      - name: Preparar WebKit de iPhone
        if: matrix.browser == 'iPhone-WebKit'
        run: npx playwright install --with-deps webkit
      - name: Navegación, cinco materias, persistencia, PWA y comparación visual
        run: npx playwright test --config=web/playwright.config.mjs --project="${{ matrix.browser }}"
      - name: Conservar evidencia real de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Web-QA-${{ matrix.browser }}-${{ github.run_id }}
          path: web/artifacts/
          retention-days: 14
  http-auth-and-duels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar catálogo privado original
        run: node scripts/competition-catalog.mjs supabase/seed.sql
      - name: Arrancar Auth y PostgREST efímeros
        run: npx --yes supabase@2.121.0 start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/cachaste-web-supabase.log 2>&1
      - name: Aplicar integración web sin cambiar las migraciones Android
        run: |
          npx --yes supabase@2.121.0 status -o json > /tmp/cachaste-web-supabase.json
          chmod 600 /tmp/cachaste-web-supabase.json
          node web/scripts/apply-local-migrations.mjs /tmp/cachaste-web-supabase.json
      - name: Regresión de duelos, estrellas y Auth originales con el esquema ampliado
        run: node scripts/test-competition-online.mjs /tmp/cachaste-web-supabase.json
      - name: Dos sesiones web, conflictos, RLS y persistencia HTTP reales
        run: node web/scripts/test-online.mjs /tmp/cachaste-web-supabase.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cachaste-Web-HTTP-QA-${{ github.run_id }}
          path: |
            web/artifacts/real-http-integration.json
            reports/competition-online-integration.json
          retention-days: 14
      - name: Eliminar cuentas y contenedores de prueba
        if: always()
        run: |
          npx --yes supabase@2.121.0 stop --no-backup
          rm -f /tmp/cachaste-web-supabase.json /tmp/cachaste-web-supabase.log
