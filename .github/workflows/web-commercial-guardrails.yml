name: Web commercial guardrails
on:
  push:
    branches:
      - 'work/cachaste-web-comercial-cierre-20261112'
  pull_request:
    paths:
      - 'web/public/**'
      - 'tests/web-commercial-launch-guard.test.mjs'
      - '.github/workflows/web-commercial-guardrails.yml'
permissions:
  contents: read
jobs:
  commercial-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies\n        run: npm ci\n      - name: Build unified educational web distribution\n        run: node web/scripts/build.mjs\n      - name: Verify private educational assets remain behind worker\n        run: |\n          node --input-type=module <<'EOF'\n          import {readFileSync,existsSync} from 'node:fs';\n          import assert from 'node:assert/strict';\n          const root='web/dist/';\n          const version=JSON.parse(readFileSync(root+'version.json','utf8'));\n          assert.equal(version.paymentsEnabledByBuild,false);\n          for(const f of ['index.html','cuenta.html','_worker.js','_routes.json','robots.txt','account.js'])assert.ok(existsSync(root+f),f);\n          assert.ok(!existsSync(root+'app/index.html'),'protected educational content must not be public');\n          assert.ok(readFileSync(root+'robots.txt','utf8').includes('Disallow: /'));\n          EOF\n      - name: Check public web commercial safeguards
        run: node --test tests/web-commercial-launch-guard.test.mjs
