name: Android Play · AAB firmado permanente
on:
  workflow_dispatch:
  push:
    branches: [work/cachaste-motor-duolingo-20261016]
    paths: ['.github/workflows/android-play.yml', 'scripts/VerifyPlayBundle.java', 'scripts/verify-play-manifest.py']
permissions:
  contents: read
concurrency:
  group: cachaste-play-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar secretos sin imprimir valores
        env:
          CACHASTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.CACHASTE_RELEASE_KEYSTORE_BASE64 }}
          CACHASTE_RELEASE_STORE_PASSWORD: ${{ secrets.CACHASTE_RELEASE_STORE_PASSWORD }}
          CACHASTE_RELEASE_KEY_ALIAS: ${{ secrets.CACHASTE_RELEASE_KEY_ALIAS }}
          CACHASTE_RELEASE_KEY_PASSWORD: ${{ secrets.CACHASTE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CACHASTE_RELEASE_KEYSTORE_BASE64 CACHASTE_RELEASE_STORE_PASSWORD CACHASTE_RELEASE_KEY_ALIAS CACHASTE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name. No se generará ningún AAB."
              missing=1
            fi
          done
          test "$missing" = 0
  integration:
    uses: ./.github/workflows/competition-integration.yml
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      - run: npm run audit:pedagogy
      - run: npm run build
      - run: bash scripts/install-chromium-qa.sh
      - name: Probar competencia y comunidad en dos tamaños Android
        run: npx playwright test tests/competition.mobile.spec.mjs tests/competition-community.mobile.spec.mjs --project=Android-Chrome --project=mobile-320px
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cachaste-Play-tests-${{ github.sha }}
          path: |
            playwright-report/
            reports/pedagogical-audit.json
          retention-days: 14
  signed-bundle:
    needs: [signing-preflight, verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_UPLOAD_SHA256: a566926f01e79e5f75422b5c03c91b4337018e4f7987b32888c650ca7f271575
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar distribución pública sin VS local ni fixtures
        run: |
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Preparar SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Preparar bundletool oficial con hash fijo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Compilar release con clave permanente y verificar todas las entradas firmadas
        env:
          CACHASTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.CACHASTE_RELEASE_KEYSTORE_BASE64 }}
          CACHASTE_RELEASE_KEYSTORE: ${{ runner.temp }}/cachaste-upload.jks
          CACHASTE_RELEASE_STORE_PASSWORD: ${{ secrets.CACHASTE_RELEASE_STORE_PASSWORD }}
          CACHASTE_RELEASE_KEY_ALIAS: ${{ secrets.CACHASTE_RELEASE_KEY_ALIAS }}
          CACHASTE_RELEASE_KEY_PASSWORD: ${{ secrets.CACHASTE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$CACHASTE_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$CACHASTE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CACHASTE_RELEASE_KEYSTORE"
          unset CACHASTE_RELEASE_KEYSTORE_BASE64
          mkdir -p play-delivery
          keytool -exportcert -rfc -keystore "$CACHASTE_RELEASE_KEYSTORE" -storepass:env CACHASTE_RELEASE_STORE_PASSWORD -alias "$CACHASTE_RELEASE_KEY_ALIAS" > play-delivery/upload-certificate.pem
          actual=$(openssl x509 -in play-delivery/upload-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          test "$actual" = "$EXPECTED_UPLOAD_SHA256" || { echo '::error::La clave no coincide con el certificado de carga fijado y confirmado por el titular.'; exit 1; }
          gradle -p android --no-daemon :app:lintRelease :app:bundleRelease
          cp android/app/build/outputs/bundle/release/app-release.aab play-delivery/Cachaste-1.5.0-rc6-33.aab
          java scripts/VerifyPlayBundle.java play-delivery/Cachaste-1.5.0-rc6-33.aab "$EXPECTED_UPLOAD_SHA256" > play-delivery/verification.json
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=play-delivery/Cachaste-1.5.0-rc6-33.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=play-delivery/Cachaste-1.5.0-rc6-33.aab --module=base > play-delivery/AndroidManifest.xml
          python3 scripts/verify-play-manifest.py play-delivery/AndroidManifest.xml > play-delivery/manifest-verification.json
          printf '%s\n' "$GITHUB_SHA" > play-delivery/source-commit.txt
          sha256sum play-delivery/*.aab > play-delivery/SHA256SUMS.txt
      - name: Eliminar clave temporal incluso tras errores
        if: always()
        run: rm -f "$RUNNER_TEMP/cachaste-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Cachaste-Play-SIGNED-33-${{ github.sha }}
          path: play-delivery/
          if-no-files-found: error
          retention-days: 30
