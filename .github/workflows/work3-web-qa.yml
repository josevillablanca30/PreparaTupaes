name: Work 3 · auditoría visual web sin despliegue
on:
  push:
    branches: [work/cachaste-web-legibilidad-final-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: work3-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test web/tests/*.test.mjs
      - run: node web/scripts/build.mjs
      - run: node web/scripts/verify-private-distribution.mjs --local
      - run: bash scripts/install-chromium-qa.sh
      - name: Auditar cinco anchos y cada mención, con estados y tutor
        run: npx playwright test --config=web/playwright.config.mjs web/tests/work3-study.spec.mjs web/tests/work3-public.spec.mjs --project=Android-Chrome
      - name: Conservar regresiones web de acceso, persistencia, perfil y navegación
        run: npx playwright test --config=web/playwright.config.mjs web/tests/web-commercial.spec.mjs web/tests/recovery.spec.mjs web/tests/content-context.spec.mjs --project=Android-Chrome --project=Desktop-Chrome --project=mobile-320px
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cachaste-Work3-Web-${{ github.sha }}
          path: web/artifacts/
          retention-days: 14
