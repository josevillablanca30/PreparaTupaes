<html lang="es-CL"><head><meta charset="utf-8">

<style>
:root{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:#28233d;background:#f9f7fd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 2%,#eee8ff,transparent 29%),#f9f7fd}
main{max-width:780px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(65px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.6px}.brand b{color:#7357d8}.toplink{color:#5946ac;text-decoration:none;font-weight:700;padding:12px 4px}
h1{font-size:clamp(29px,7vw,45px);line-height:1.15;letter-spacing:-1.4px;margin:12px 0}
h2{font-size:clamp(20px,5vw,25px);letter-spacing:-.5px;margin:0 0 12px}h3{margin:0 0 8px;font-size:18px}
p{line-height:1.55;color:#5f5a70}small,.small{font-size:13px;color:#6d657d;line-height:1.5}
.eyebrow{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:#7357d8}
.card{background:white;border:1px solid #e6e0f2;border-radius:23px;padding:clamp(16px,4vw,26px);margin:17px 0;box-shadow:0 12px 33px #3e2f6f0a}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:10px}
.btn{font:700 15px system-ui;line-height:1.35;border:0;border-radius:14px;background:#7357d8;color:white;padding:14px 17px;min-height:48px;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.btn.secondary{background:#eee9fc;color:#50399f}.btn.soft{background:#fff1e3;color:#794923;border:1px solid #e9bf93}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:focus-visible,.option:focus-visible,.toplink:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6b4ec7;outline-offset:3px}
.track-grid,.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.track{border:2px solid #e6e0f2;border-radius:17px;background:#fff;padding:14px;text-align:left;min-height:69px;font:700 15px system-ui;color:#372f5c;cursor:pointer}
.track.active{border-color:#7457d8;background:#efeaff}.track small{display:block;margin-top:5px;font-weight:500}
.option{width:100%;min-height:54px;background:#fff;color:#29243c;border:2px solid #e4dff2;border-radius:14px;text-align:left;padding:14px 16px;font:500 16px system-ui;cursor:pointer;overflow-wrap:anywhere}
.option.selected{border-color:#7357d8;background:#f1edff}.option.right{border-color:#279872;background:#edfff4}.option.wrong{border-color:#da6776;background:#fff0f2}
.pill{display:inline-block;background:#f0eaff;border-radius:100px;padding:6px 11px;font-size:12px;font-weight:750;color:#5b44ab}
.bar{height:10px;background:#eae6f3;border-radius:12px;overflow:hidden;margin:13px 0}.bar>div{height:100%;background:#7357d8}
.explain{background:#eff9f3;border-radius:14px;padding:16px;margin-top:14px}.explain.error{background:#fff1ed}
.hint{border-left:4px solid #dca35d;background:#fff8ef;padding:14px;margin:13px 0;border-radius:11px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.actions .btn{flex:1 1 150px}.tabrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.tabrow .btn{font-size:13px;min-height:45px}
textarea{display:block;width:100%;min-height:110px;border:1.5px solid #cec5e7;border-radius:13px;padding:12px;font:15px system-ui;color:#2d2750;resize:vertical}
label{display:block;font-weight:750;margin:12px 0 7px}select{font:600 15px system-ui;border:1.5px solid #cec5e7;border-radius:12px;padding:12px;max-width:100%;width:100%;background:white;color:#302949;min-height:48px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat>div{background:#f4f0ff;border-radius:14px;padding:15px}.stat strong{display:block;font-size:24px}
.checklist{padding-left:21px;line-height:1.8;color:#595268}details{border-top:1px solid #eee9f6;padding:12px 0}summary{cursor:pointer;font-weight:750}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:370px){.track-grid,.subject-grid{grid-template-columns:1fr}.card{padding:15px}.actions{display:grid;grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){button{transition:transform .16s,background-color .16s}button:active{transform:scale(.985)}}
.subjects-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.subjects-nav .toplink{font-size:13px;padding:11px 13px;min-height:44px;border-radius:13px;background:#f0ebfc;text-decoration:none}.subjects-nav .toplink:first-child{background:#eae2fb;color:#4d349e}.exam-choices{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-width:0;gap:12px}.exam-choice{min-width:0;max-width:100%;overflow-wrap:anywhere;padding:17px;border:1.5px solid #e8e2f2;border-radius:17px;background:#fff}.exam-choice.recommended{border-color:#8870d4;background:#f9f6ff}.exam-choice .row{flex-wrap:wrap;gap:8px;min-width:0}.exam-choice .pill{white-space:normal;max-width:100%}.exam-choice .btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}.exam-choice h3{margin:0}.exam-choice .pill{white-space:nowrap}.exam-choice p{margin:9px 0 15px}.exam-choice>.btn{width:100%}.confidence-field{border:1px solid #e3dbee;border-radius:14px;padding:12px;margin:16px 0}.confidence-field legend{font-weight:800;color:#403366;padding:0 5px}.confidence-choices{display:flex;flex-wrap:wrap;gap:9px}.confidence-choice{font:700 13px system-ui;color:#514072;background:#f5f1fb;border:2px solid transparent;border-radius:12px;padding:12px;min-height:46px;cursor:pointer;flex:1 1 130px}.confidence-choice.active{border-color:#795bd1;background:#eae2ff}.learning-plan{border-color:#e0d5f5}.weak-area{border-top:1px solid #ebe6f1;padding:12px 0}.weak-area strong{font-size:14px}.weak-area p{margin:5px 0}.science-subject-stat{padding:13px 0;border-bottom:1px solid #eee9f6}.science-subject-stat .row{align-items:flex-start}.science-subject-stat .row span{color:#6d657d;font-size:13px}.reinforcement summary{min-height:48px;display:flex;align-items:center;color:#5b439a}.reinforcement summary:focus-visible{outline:3px solid #795bd1}@media(max-width:370px){.confidence-choices{display:grid;grid-template-columns:1fr}.exam-choice{padding:13px}}</style></head>
