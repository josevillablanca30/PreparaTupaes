plugins { id 'com.android.application' }
// Instrumentation exercises the commercial package policy without enabling purchases.
def commercialAccessQa = project.hasProperty('cachasteCommercialAccessQa')
def releaseValues = ['CACHASTE_RELEASE_KEYSTORE', 'CACHASTE_RELEASE_STORE_PASSWORD', 'CACHASTE_RELEASE_KEY_ALIAS', 'CACHASTE_RELEASE_KEY_PASSWORD'].collectEntries { name -> [(name): System.getenv(name)] }
def hasReleaseSigning = releaseValues.values().every { it != null && !it.isBlank() }
if (releaseValues.values().any { it != null && !it.isBlank() } && !hasReleaseSigning) {
    throw new GradleException('Firma release incompleta: se requieren las cuatro variables CACHASTE_RELEASE_*; no se usará una firma de prueba.')
}
android {
    namespace 'cl.preparatupaes.app'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.preparatupaes.app'
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 34
        versionName '1.5.0-rc7'
        buildConfigField 'boolean', 'CACHASTE_PLAY_ENABLED', String.valueOf(System.getenv('CACHASTE_PLAY_ENABLED') == 'true')
    }
    signingConfigs {
        if (hasReleaseSigning) {
            production {
                storeFile file(releaseValues.CACHASTE_RELEASE_KEYSTORE)
                storePassword releaseValues.CACHASTE_RELEASE_STORE_PASSWORD
                keyAlias releaseValues.CACHASTE_RELEASE_KEY_ALIAS
                keyPassword releaseValues.CACHASTE_RELEASE_KEY_PASSWORD
            }
        }
        debug {
            // CI usa una ruta explícita que también recupera la caché. Nunca es una clave de publicación.
            def betaKeystore = System.getenv('CACHASTE_DEBUG_KEYSTORE')
            if (betaKeystore) {
                storeFile file(betaKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix(commercialAccessQa ? '' : '.sciencebeta')
            resValue 'string', 'app_name', 'Cachaste Beta'
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.production
            minifyEnabled false
            resValue 'string', 'app_name', 'Cachaste'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    if (commercialAccessQa) sourceSets.androidTest.java.srcDir 'src/commercialAccessQa/java'
    else {
        sourceSets.debug.assets.srcDir 'src/beta/assets'
        sourceSets.androidTest.java.srcDir 'src/betaTest/java'
    }
}

dependencies {
    // Align the split JDK libraries with the stdlib already required by AndroidX/Billing.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "androidx.webkit:webkit:1.15.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "junit:junit:4.13.2"
}

// Release artifacts must never silently fall back to unsigned or debug signing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && (it.name == 'bundleRelease' || it.name == 'assembleRelease') } && !hasReleaseSigning) {
        throw new GradleException('Release requiere la clave de carga permanente. Configure los secretos CACHASTE_RELEASE_* antes de compilar.')
    }
}
