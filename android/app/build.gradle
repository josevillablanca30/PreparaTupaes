plugins { id 'com.android.application' }
android {
    namespace 'cl.preparatupaes.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.preparatupaes.app'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.7.1'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.sciencebeta'
            resValue 'string', 'app_name', 'Cachaste Ciencias Beta'
        }
        release {
            minifyEnabled false
            resValue 'string', 'app_name', 'Cachaste'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
