plugins { id 'com.android.application' }
android {
    namespace 'cl.preparatupaes.app'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.preparatupaes.app'
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 14
        versionName '1.3.0-beta-camino'
    }
    signingConfigs {
        debug {
            // CI usa una ruta explícita que también recupera la caché. Nunca es una clave de publicación.
            def betaKeystore = System.getenv('CACHASTE_DEBUG_KEYSTORE')
            if (betaKeystore) {
                storeFile file(betaKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.sciencebeta'
            resValue 'string', 'app_name', 'Cachaste Beta'
        }
        release {
            minifyEnabled false
            resValue 'string', 'app_name', 'Cachaste'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "junit:junit:4.13.2"
}
